# Mẫu manifest cho gói context hoặc release QMD.
# Dùng đúng phiên bản đã triển khai trong mã; không điền phiên bản đích như thể đã có hiệu lực.
# Các giá trị "unknown" phải được thay bằng dữ liệu đã xác nhận khi hợp đồng yêu cầu.

manifest_version: 1

package:
  id: qmd-context-YYYYMMDD-HHMMSS
  kind: context
  purpose: "Mô tả ngắn mục đích gói"
  created_at: "YYYY-MM-DDTHH:MM:SS+07:00"
  created_by: unknown

system:
  qmd_core_version: "1.0"
  checker_version: "2.6.0"
  project_config_schema: 1
  operations_contract_version: "0.3"
  manifest_schema: 1

repository:
  name: zo_math
  source: exported_snapshot
  branch: master
  commit: unknown
  dirty: unknown
  ahead_of_origin: unknown

scope:
  mode: documentation
  roots:
    - quy_trinh_xay_dung/he_thong_san_xuat_qmd
  excluded: []

# Công cụ tạo gói phải nhận đường dẫn này tường minh.
# Không mặc định đặt gói ở gốc repository hoặc thư mục dự án.
output:
  path: unknown
  inside_repository: false
  reason: null

entrypoints:
  current:
    checker: scripts/zo_check_repo.py
    operations_cli: scripts/zo_qmd.py
  target: {}

sources:
  required:
    - path: AGENTS.md
      role: repository_instructions
    - path: quy_trinh_xay_dung/he_thong_san_xuat_qmd/README.md
      role: system_entry
  conditional: []
  historical: []

evidence:
  commands: []
  reports: []
  outputs: []

integrity:
  algorithm: sha256
  file: FILES.sha256

limitations: []

# Chỉ dùng nhóm dưới đây khi package.kind: release.
# Gói release O3 phải được tạo từ worktree sạch và hồ sơ --release-file đã đạt.
# release:
#   stage: candidate
#   version: "0.3.0"
#   tag: qmd-ops-v0.3.0
#   tag_created: false
#   previous_version: "0.2.0"
#   previous_commit: c1b26b9a0536b17e0885d8158fddbd20413767c2
#   candidate_commit: full-40-character-sha
#   regression_status: pass
#   rollback_tested: true
# change:
#   semver: minor
#   classifications:
#     - operations_contract
#     - cli
#     - package_module
#   migration_required: false
#   migration_summary: "Gói context giữ giao diện tương thích."
