id: P02
dimension: 2d
backend: tkz-euclide
points:
  - {id: O, coordinates: [0, 0]}
  - {id: T, coordinates: [1.6, 1.2]}
  - {id: U, coordinates: [0.4, 2.8], draw: false}
  - {id: V, coordinates: [2.8, -0.4], draw: false}
objects:
  - {type: circle, center: O, through: T, role: visible}
  - {type: segment, endpoints: [O, T], role: auxiliary}
  - {type: segment, endpoints: [U, V], role: emphasized}
  - {type: right_angle_mark, points: [O, T, U], role: emphasized, size: .22}
relations:
  - {type: circle_tangent, center: O, radius: 2, point: T, line: [U, V]}
labels:
  - {target: O, text: "$O$", anchor: below left, mask: none}
  - {target: T, text: "$T$", anchor: "above right=3pt and 2pt", mask: none}
