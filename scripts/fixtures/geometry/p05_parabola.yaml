id: P05
dimension: 2d
backend: tkz-euclide
points:
  - {id: O, coordinates: [0, 0]}
  - {id: F, coordinates: [0.7, 0]}
  - {id: T, coordinates: [1.15714286, 1.8]}
  - {id: U, coordinates: [-0.24285714, 0.71111111], draw: false}
  - {id: V, coordinates: [2.55714286, 2.88888889], draw: false}
  - {id: L1, coordinates: [-0.7, -3.2], draw: false}
  - {id: L2, coordinates: [-0.7, 3.2], draw: false}
objects:
  - {type: parabola, vertex: O, p: 0.7, domain: [-3.2, 3.2], role: visible}
  - {type: segment, endpoints: [L1, L2], role: auxiliary}
  - {type: segment, endpoints: [U, V], role: emphasized}
relations:
  - {type: parabola_tangent, vertex: O, p: 0.7, point: T, line: [U, V]}
labels:
  - {target: O, text: "$O$", anchor: "below left=4pt and 3pt", mask: none}
  - {target: F, text: "$F$", anchor: "below=5pt", mask: none}
  - {target: T, text: "$T$", anchor: "above left=4pt and 3pt", mask: none}
