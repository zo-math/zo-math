id: P01
dimension: 2d
backend: tkz-euclide
points:
  - id: B
    coordinates: [0, 0]
  - id: C
    coordinates: [5, 0]
  - id: A
    coordinates: [1.45, 3.1]
  - id: H
    construction:
      type: projection
      source: A
      onto: [B, C]
  - id: O
    construction:
      type: circumcenter
      points: [A, B, C]
objects:
  - type: circle
    center: O
    through: A
    role: auxiliary
  - type: polygon
    points: [A, B, C]
    role: visible
  - type: segment
    endpoints: [A, H]
    role: emphasized
  - type: right_angle_mark
    points: [A, H, B]
    role: emphasized
    size: .25
labels:
  - {target: A, text: "$A$", anchor: above, mask: none}
  - {target: B, text: "$B$", anchor: below left, mask: none}
  - {target: C, text: "$C$", anchor: below right, mask: none}
  - {target: H, text: "$H$", anchor: below, mask: none}
  - {target: O, text: "$O$", anchor: above right, mask: none}
