id: S04
dimension: 3d
backend: tikz-3dplot
solid_type: convex_polyhedron
camera: {elevation: 68, azimuth: 118, scale: 1.05}
vertices:
  - {id: A, coordinates: [0, 0, 0]}
  - {id: B, coordinates: [4, 0, 0]}
  - {id: C, coordinates: [1, 3, 0]}
  - {id: A1, coordinates: [0.8, 0.5, 2.4]}
  - {id: B1, coordinates: [4.8, 0.5, 2.4]}
  - {id: C1, coordinates: [1.8, 3.5, 2.4]}
edges:
  - {id: AB, endpoints: [A, B], visibility: auto}
  - {id: BC, endpoints: [B, C], visibility: auto}
  - {id: CA, endpoints: [C, A], visibility: auto}
  - {id: A1B1, endpoints: [A1, B1], visibility: auto}
  - {id: B1C1, endpoints: [B1, C1], visibility: auto}
  - {id: C1A1, endpoints: [C1, A1], visibility: auto}
  - {id: AA1, endpoints: [A, A1], visibility: auto}
  - {id: BB1, endpoints: [B, B1], visibility: auto}
  - {id: CC1, endpoints: [C, C1], visibility: auto}
faces:
  - {id: base, points: [A, B, C], render: true}
  - {id: top, points: [A1, B1, C1], render: false}
  - {id: side_ab, points: [A, B, B1, A1], render: false}
  - {id: side_bc, points: [B, C, C1, B1], render: false}
  - {id: side_ca, points: [C, A, A1, C1], render: false}
visibility_overrides: []
labels:
  - {target: A, text: "$A$", anchor: "below left=3pt and 2pt", mask: none}
  - {target: B, text: "$B$", anchor: "below left=2pt and 1pt", mask: none}
  - {target: C, text: "$C$", anchor: "right=4pt", mask: none}
  - {target: A1, text: '$A_1$', anchor: "left=4pt", mask: none}
  - {target: B1, text: '$B_1$', anchor: "above left=3pt and 1pt", mask: none}
  - {target: C1, text: '$C_1$', anchor: "above right=3pt and 1pt", mask: none}
