id: S06
dimension: 3d
backend: tikz-3dplot
solid_type: convex_box
camera: {elevation: 68, azimuth: 118, scale: 1.05}
vertices:
  - {id: A, coordinates: [0, 0, 0]}
  - {id: B, coordinates: [3, 0, 0]}
  - {id: C, coordinates: [3, 3, 0]}
  - {id: D, coordinates: [0, 3, 0]}
  - {id: A1, coordinates: [0, 0, 3]}
  - {id: B1, coordinates: [3, 0, 3]}
  - {id: C1, coordinates: [3, 3, 3]}
  - {id: D1, coordinates: [0, 3, 3]}
edges:
  - {id: AB, endpoints: [A, B], visibility: auto}
  - {id: BC, endpoints: [B, C], visibility: auto}
  - {id: CD, endpoints: [C, D], visibility: auto}
  - {id: DA, endpoints: [D, A], visibility: auto}
  - {id: A1B1, endpoints: [A1, B1], visibility: auto}
  - {id: B1C1, endpoints: [B1, C1], visibility: auto}
  - {id: C1D1, endpoints: [C1, D1], visibility: auto}
  - {id: D1A1, endpoints: [D1, A1], visibility: auto}
  - {id: AA1, endpoints: [A, A1], visibility: auto}
  - {id: BB1, endpoints: [B, B1], visibility: auto}
  - {id: CC1, endpoints: [C, C1], visibility: auto}
  - {id: DD1, endpoints: [D, D1], visibility: auto}
faces:
  - {id: base, points: [A, B, C, D], render: true}
  - {id: top, points: [A1, B1, C1, D1], render: false}
  - {id: side_ab, points: [A, B, B1, A1], render: false}
  - {id: side_bc, points: [B, C, C1, B1], render: false}
  - {id: side_cd, points: [C, D, D1, C1], render: false}
  - {id: side_da, points: [D, A, A1, D1], render: false}
section:
  id: sigma
  plane: {normal: [1, 1, 1], offset: -4.5}
  edges: [A1B1, BB1, BC, CD, DD1, D1A1]
  point_ids: [M, N, P, Q, R, T]
  emphasized: true
visibility_overrides: []
labels:
  - {target: A, text: "$A$", anchor: "below left=3pt and 2pt", mask: none}
  - {target: B, text: "$B$", anchor: "below left=2pt and 1pt", mask: none}
  - {target: C, text: "$C$", anchor: "below right=2pt and 1pt", mask: none}
  - {target: D, text: "$D$", anchor: "right=4pt", mask: none}
  - {target: A1, text: '$A_1$', anchor: "above left=2pt and 1pt", mask: none}
  - {target: B1, text: '$B_1$', anchor: "left=4pt", mask: none}
  - {target: C1, text: '$C_1$', anchor: "right=4pt", mask: none}
  - {target: D1, text: '$D_1$', anchor: "above left=2pt and 1pt", mask: none}
  - {target: M, text: "$M$", anchor: "above=5pt", mask: none}
  - {target: N, text: "$N$", anchor: "left=5pt", mask: none}
  - {target: P, text: "$P$", anchor: "below left=4pt and 2pt", mask: none}
  - {target: Q, text: "$Q$", anchor: "below right=4pt and 2pt", mask: none}
  - {target: R, text: "$R$", anchor: "right=5pt", mask: none}
  - {target: T, text: "$T$", anchor: "above=5pt", mask: none}
