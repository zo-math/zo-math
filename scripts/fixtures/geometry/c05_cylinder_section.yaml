id: C05
dimension: 3d
backend: tikz-3dplot
solid_type: cylinder
camera: {elevation: 68, azimuth: 118, scale: 1.05}
vertices:
  - {id: O, coordinates: [0, 0, 0]}
  - {id: O1, coordinates: [0, 0, 3]}
cylinder:
  bottom_center: O
  top_center: O1
  radius: 2
curve_section:
  type: oblique_plane
  z_center: 1.5
  x_slope: -0.2
  y_slope: 0.05
segments:
  - {id: OO1, endpoints: [O, O1], role: auxiliary, visibility: hidden}
labels:
  - {target: O, text: "$O$", anchor: "below right=3pt and 2pt", mask: none}
  - {target: O1, text: '$O_1$', anchor: "above right=3pt and 2pt", mask: none}
