id: C04
dimension: 3d
backend: tikz-3dplot
solid_type: frustum
camera:
  elevation: 68
  azimuth: 118
  scale: 1.05
vertices:
  - {id: O, coordinates: [0, 0, 0]}
  - {id: O1, coordinates: [0, 0, 3]}
frustum:
  bottom_center: O
  top_center: O1
  bottom_radius: 2.2
  top_radius: 1.15
segments:
  - {id: OO1, endpoints: [O, O1], role: auxiliary, visibility: hidden}
labels:
  - {target: O, text: "$O$", anchor: "below right=3pt and 2pt", mask: none}
  - {target: O1, text: '$O_1$', anchor: "right=5pt", mask: none}
visibility_overrides: []
