id: C05
dimension: 3d
backend: tikz-3dplot
solid_type: sphere
camera: {elevation: 68, azimuth: 118, scale: 1.0}
vertices:
  - {id: O, coordinates: [0, 0, 0]}
  - {id: N, coordinates: [0, 0, 2]}
  - {id: S, coordinates: [0, 0, -2]}
sphere:
  center: O
  radius: 2
segments:
  - {id: NS, endpoints: [N, S], role: auxiliary, visibility: hidden}
labels:
  - {target: O, text: "$O$", anchor: "below right=4pt and 2pt", mask: none}
  - {target: N, text: "$N$", anchor: "above=4pt", mask: none}
  - {target: S, text: "$S$", anchor: "below=4pt", mask: none}
