<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">{{TITLE}}</title>
  <desc id="cover-description">{{DESCRIPTION}}</desc>
  <style>
    @font-face { font-family: "STIX Two Text"; src: url("data:font/woff2;base64,{{FONT_DATA}}") format("woff2"); font-weight: 400; font-style: normal; }
    text { font-family: "STIX Two Text", serif; font-weight: 400; }
  </style>
  <rect width="1200" height="900" fill="{{WHITE}}"/>
  <g id="cover-content" data-safe-area="72" data-grid-columns="6">
    <image x="72" y="72" width="112" height="112" preserveAspectRatio="xMinYMin meet" href="data:image/svg+xml;base64,{{LOGO_DATA}}" xlink:href="data:image/svg+xml;base64,{{LOGO_DATA}}"/>
{{CONTENT}}
  </g>
</svg>
