    verified_on: "2026-10-12"
  tagline: "Học từ chỗ hổng thực sự, củng cố từng nền tảng và theo dõi tiến bộ qua các gói học liệu có cấu trúc."
  introduction: "Chương trình tổ chức việc ôn Toán theo những mạch kiến thức liên kết: nhận diện phần cần bổ sung, ôn lại, luyện tập, tự kiểm tra và sửa lỗi bằng bài mới."
  purpose: "Biết mình cần củng cố gì, hiểu điều kiện của cách làm, tự chọn công cụ và kiểm tra lại phần đã sửa."
  learning_steps:
    - "Trong mỗi gói, mạch học chính là Bài học → Luyện tập → Kiểm tra → Ôn lại. Em có thể đi tới hoặc quay lại theo nhu cầu; phần bỏ qua không tự được xem là đã đạt."
    - "Khi gặp trở ngại, xem lại đúng phần Bài học hoặc Ôn nền; sau khi tự làm, đối chiếu Lời giải và Sửa lỗi khi cần, rồi quay về nhiệm vụ đang dừng. Riêng khi đang Kiểm tra, tự lực hoàn toàn; chỉ dùng hỗ trợ sau khi kết thúc lượt ấy."
    - "Ghi Nhật kí khi có quyết định hoặc kết thúc buổi học, giữ bài làm ban đầu và hẹn Ôn lại. Không cần ghi sau mọi thao tác; hướng dẫn chi tiết nằm trong từng gói."
  roadmap:
    - "Định vị đầu vào."
    - "Ôn trọng tâm."
    - "Phối hợp kiến thức."
    - "Luyện đề và chữa lỗi."
    - "Củng cố trước thi."
  strands:
    - {id: R1, title: "Hàm số, đạo hàm và đồ thị", description: "Em học ý nghĩa và cách tính đạo hàm, dùng đạo hàm để xét hàm số tăng, giảm, tìm cực trị và giá trị lớn nhất, nhỏ nhất trên một tập cho trước. Kết hợp với giới hạn, em xác định tiệm cận, khảo sát và vẽ đồ thị; vận dụng để giải bài toán về tốc độ thay đổi và tối ưu."}
    - {id: R2, title: "Thống kê và đọc dữ liệu", description: "Em học cách chọn số trung bình, trung vị hoặc mốt để mô tả giá trị đại diện, và dùng các số đo độ phân tán để biết số liệu tập trung hay trải rộng. Với bảng, biểu đồ và số liệu ghép nhóm, em tính toán, so sánh các nhóm và giải thích kết quả, đồng thời nhận ra dữ liệu bất hợp lí và giới hạn của kết luận."}
    - {id: R3, title: "Hình học, vectơ và tọa độ", description: "Em học cách giải tam giác, chứng minh các quan hệ song song, vuông góc và tính góc, khoảng cách, diện tích, thể tích. Vectơ và tọa độ giúp chuyển bài hình thành phép tính hoặc phương trình. Em học cách biểu diễn và giải bài toán về đường thẳng, đường tròn, elip, hypebol, parabol trong mặt phẳng; đường thẳng, mặt phẳng và mặt cầu trong không gian."}
    - {id: R4, title: "Đếm và xác suất", description: "Em học cách đếm số cách chọn, sắp xếp và các kết quả có thể xảy ra của một phép thử. Các quy tắc cộng, nhân xác suất giúp giải bài toán có nhiều biến cố, với sự phân biệt rõ giữa xung khắc và độc lập. Em cũng học cách tính xác suất khi biết thêm thông tin, dùng bảng số liệu, sơ đồ cây, công thức xác suất toàn phần và Bayes."}
    - {id: R5, title: "Dãy số, mũ và lôgarit", description: "Em học cách mô tả dãy số, tính số hạng và tổng của cấp số cộng, cấp số nhân, rồi tìm hiểu giới hạn của dãy. Phần mũ và lôgarit giúp hiểu sự tăng, giảm theo tỉ lệ và cách tìm số mũ khi biết cơ số và giá trị của lũy thừa. Em đọc đồ thị, giải phương trình và bất phương trình để tính các đại lượng hoặc thời gian đạt một giá trị cho trước."}
    - {id: R6, title: "Hàm số lượng giác và phương trình lượng giác", description: "Em dùng đường tròn lượng giác để hiểu góc quay, các giá trị sin, cos, tan, cot và những công thức liên hệ giữa chúng. Em học đồ thị, tính tuần hoàn của các hàm lượng giác, tìm đầy đủ nghiệm của phương trình cơ bản và chọn nghiệm theo điều kiện. Kiến thức này giúp giải bài toán về góc, chuyển động và những hiện tượng lặp lại theo chu kì."}
    - {id: R7, title: "Nguyên hàm, tích phân và ứng dụng", description: "Em học cách tìm một hàm số khi biết đạo hàm của nó và dùng điều kiện đã cho để xác định hàm cần tìm. Với tích phân, em tính lượng tích lũy trong một khoảng, chẳng hạn tính quãng đường khi biết vận tốc theo thời gian; đồng thời tính diện tích hình phẳng và thể tích vật thể. Trọng tâm là lập đúng biểu thức và cận tích phân trước khi tính."}
    - {id: R8, title: "Mô hình hóa, tối ưu và bài toán tổng hợp", description: "Em luyện chuyển một tình huống thành bài toán: xác định đại lượng cần tìm, biểu diễn các quan hệ và điều kiện bằng công thức, phương trình hoặc bất phương trình. Trong các bài tổng hợp, em tự chọn và phối hợp kiến thức để giải, chẳng hạn tìm phương án có chi phí thấp nhất hoặc thể tích lớn nhất. Kết quả phải đáp ứng điều kiện và trả lời đúng câu hỏi ban đầu."}
  foundations_note: "Nền N được bổ sung theo nhu cầu."
  r8_note: "R8 xuất hiện xuyên các mạch."
  strands_note: "Đây không phải tám khóa học đã mở."
  d0: "Trong mạch R1, chọn R1-G01 — Đơn điệu và cực trị khi em cần củng cố cách dùng dấu đạo hàm, bảng biến thiên và đồ thị để xét đơn điệu, cực trị. Chọn R1-G02 — Giá trị lớn nhất và giá trị nhỏ nhất khi em cần phân biệt cực trị với giá trị lớn nhất, nhỏ nhất và tìm các giá trị ấy trên một tập được chỉ định."
packages:
  - id: d0
    summary: "Thử một số câu hỏi để nhận ra phần mình đã biết và phần cần ôn thêm. Em có thể chọn những câu phù hợp với kiến thức đã học, không cần làm hết."
  - id: r1_g01
    learner_availability: preview
    summary: "Khi nào hàm số đồng biến, nghịch biến? Làm sao tìm cực trị? Tìm hiểu qua công thức, dấu đạo hàm, bảng biến thiên và đồ thị."
  - id: r1_g02
    learner_availability: preview
    summary: "Tìm giá trị lớn nhất, nhỏ nhất trên một tập cho trước. Phân biệt chúng với cực trị và xác định những điểm mà hàm số nhận các giá trị ấy."
  - id: r1_g03
    learner_availability: preview
    summary: "Đọc giới hạn để xác định tiệm cận đứng, ngang và xiên; xét đúng tập xác định và phân biệt giới hạn từ bên trái, bên phải, khi biến tiến tới âm vô cực hoặc dương vô cực."
  - id: r1_g04
    learner_availability: preview
    summary: "Kết hợp đạo hàm, giới hạn và tiệm cận để khảo sát sự biến thiên, vẽ đồ thị và kiểm tra tính đối xứng của hàm số."
  - id: r1_g05
    learner_availability: preview
    summary: "Dùng đạo hàm để giải thích tốc độ thay đổi và giải bài toán tối ưu thực tế. Chọn đại lượng, lập mô hình, xét các giá trị biến được phép nhận và kiểm tra kết quả trong bối cảnh, kể cả lựa chọn nguyên."
  - id: r2_g01
    summary: "Đọc đúng dữ liệu, hiểu ý nghĩa của số trung bình, trung vị và mốt; chọn số đại diện phù hợp với câu hỏi và nhận biết giới hạn của kết quả khi dữ liệu được ghép nhóm."
  - id: r2_g02
    learner_availability: preview
    summary: "Hiểu độ trải của dữ liệu; tính khoảng biến thiên, khoảng tứ phân vị, phương sai và độ lệch chuẩn; so sánh đúng đơn vị, loại dữ liệu và phạm vi kết luận."
latest_package: r2_g02
