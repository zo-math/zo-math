schema_version: 1
program:
  id: on_thi_toan_thpt_2027
  title: "Ôn thi Toán THPT 2027"
  year: 2027
  status: "Đang triển khai"
  tagline: "Học từ chỗ hổng thực sự, củng cố từng nền tảng và theo dõi tiến bộ qua các gói học liệu có cấu trúc."
  introduction: "Chương trình tổ chức việc ôn Toán theo những mạch kiến thức liên kết: nhận diện phần cần bổ sung, ôn lại, luyện tập, tự kiểm tra và sửa lỗi bằng bài mới."
  audience: "Dành cho học sinh lớp 12 đã tiếp cận kiến thức lớp 10–11, với nền tảng và mục tiêu khác nhau. Phần chưa học được ghi riêng; việc ôn cần phù hợp với tiến độ ở trường và thời gian thực có."
  purpose: "Biết mình cần củng cố gì, hiểu điều kiện của cách làm, tự chọn công cụ và kiểm tra lại phần đã sửa."
  learning_steps:
    - "Tự làm trước khi xem lời giải."
    - "Đọc đúng phần cần ôn."
    - "Luyện tập và đối chiếu."
    - "Ghi lại lỗi."
    - "Thử một câu mới."
    - "Quay lại ôn khi cần."
  roadmap:
    - "Định vị đầu vào."
    - "Ôn trọng tâm."
    - "Phối hợp kiến thức."
    - "Luyện đề và chữa lỗi."
    - "Củng cố trước thi."
  roadmap_note: "Lộ trình được điều chỉnh theo phần đã học, bài làm và quỹ thời gian; đây không phải lịch bắt buộc giống nhau cho mọi học sinh."
  strands:
    - {id: R1, title: "Hàm số, đạo hàm, đồ thị"}
    - {id: R2, title: "Thống kê và đọc dữ liệu"}
    - {id: R3, title: "Hình học, vectơ và tọa độ"}
    - {id: R4, title: "Đếm và xác suất"}
    - {id: R5, title: "Dãy số, mũ và lôgarit"}
    - {id: R6, title: "Hàm số lượng giác và phương trình lượng giác"}
    - {id: R7, title: "Nguyên hàm, tích phân và ứng dụng"}
    - {id: R8, title: "Mô hình hóa, tối ưu và tổng hợp"}
  foundations_note: "Nền N được bổ sung theo nhu cầu."
  r8_note: "R8 xuất hiện xuyên các mạch."
  strands_note: "Đây không phải tám khóa học đã mở."
  start: "Nếu cần củng cố mối liên hệ giữa hàm số, bảng biến thiên và đồ thị, hãy mở R1-G01 và bắt đầu ở phần Cách học. Bốn câu hỏi khởi động giúp em xác định phần cần ôn."
  d0: "Nếu chưa biết nên bắt đầu từ đâu, em có thể làm [Khảo sát đầu vào D0](/content/thpt/on_thi_toan_thpt/hoc_lieu/d0/index.html) để định vị những phần đã học và chọn mạch ôn phù hợp."
  deployment: "Chương trình đang triển khai. Danh mục dưới đây chỉ hiển thị những học liệu đã có trong đợt phát hành."
packages:
  - id: d0
    summary: "Khảo sát tự nguyện để định vị những phần đã học và chọn mạch ôn phù hợp; không yêu cầu làm đủ câu hay đạt điểm mới được vào học."
  - id: r1_g01
    summary: "Đọc công thức, bảng biến thiên và đồ thị; dùng dấu đạo hàm để giải thích tính đơn điệu và cực trị."
  - id: r1_g02
    summary: "Phân biệt cực trị với giá trị lớn nhất, nhỏ nhất; tìm đúng giá trị trên tập được chỉ định và kiểm tra sự đạt được."
latest_package: r1_g02
