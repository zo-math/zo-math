objectives:
  - id: G02-M1
    description: Xác định đúng hàm số, tập xác định D và tập đang xét K.
    essential: true
    prerequisite_ids: []
    dependent_objective_ids: [G02-M2, G02-M3, G02-M4, G02-M5, G02-M6]
  - id: G02-M2
    description: Phân biệt cực trị với giá trị lớn nhất, nhỏ nhất; kiểm tra so sánh và sự đạt được.
    essential: true
    prerequisite_ids: [G02-M1]
    dependent_objective_ids: [G02-M3, G02-M4]
  - id: G02-M3
    description: Tìm giá trị lớn nhất và nhỏ nhất trên đoạn đóng.
    essential: true
    prerequisite_ids: [G02-M1, G02-M2]
    dependent_objective_ids: [G02-M5, G02-M6]
  - id: G02-M4
    description: Giải thích tồn tại hoặc không tồn tại trên khoảng hở, tập rời hoặc không bị chặn.
    essential: true
    prerequisite_ids: [G02-M1, G02-M2]
    dependent_objective_ids: []
  - id: G02-M5
    description: Chọn công cụ, lập hàm mục tiêu và xử lí ràng buộc thực hoặc nguyên.
    essential: true
    prerequisite_ids: [G02-M1, G02-M3]
    dependent_objective_ids: []
  - id: G02-M6
    description: Chuyển giao quy trình sang họ hàm lượng giác, mũ và lôgarit.
    essential: false
    prerequisite_ids: [G02-M1, G02-M3]
    dependent_objective_ids: []

