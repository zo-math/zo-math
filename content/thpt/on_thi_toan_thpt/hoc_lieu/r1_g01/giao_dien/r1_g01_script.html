<script>
(() => {
  const root = document.querySelector('.r1-g01');
  if (!root) return;
  // The shared panel moves the native TOC and assigns role="region".
  // Preserve its document-TOC semantics before Quarto initializes ScrollSpy;
  // keep using the shared panel and Quarto's own active-section tracking.
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('nav#TOC.toc-active')?.setAttribute('role', 'doc-toc');
  });
  // Quarto adds a separate draft alert after Pandoc. Reuse that actual status
  // element at the package's approved label, rather than hiding a blank band.
  // The draft metadata and publication policy remain untouched.
  const draft = document.getElementById('quarto-draft-alert');
  const status = root.querySelector('.r1-status');
  if (draft && status) {
    draft.textContent = status.textContent.trim();
    draft.className = '';
    status.replaceChildren(draft);
  }
  function reveal(hash) {
    let id;
    try { id = decodeURIComponent(hash.slice(1)); } catch { return; }
    const target = document.getElementById(id);
    if (!target || !root.contains(target)) return;
    for (let node = target; node && node !== root; node = node.parentElement) {
      if (node.tagName === 'DETAILS') node.open = true;
    }
    target.scrollIntoView({block: 'start'});
  }
  window.addEventListener('hashchange', () => reveal(location.hash));
  window.addEventListener('load', () => reveal(location.hash));
  root.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (link && root.contains(link) && link.hash &&
        link.origin === location.origin && link.pathname === location.pathname) {
      reveal(link.hash);
    }
  });
})();
</script>
