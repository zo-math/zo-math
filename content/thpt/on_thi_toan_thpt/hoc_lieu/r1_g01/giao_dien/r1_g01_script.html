<script>
(() => {
  const root = document.querySelector('.r1-g01');
  if (!root) return;
  let savedOpen = null;
  const tools = document.createElement('div');
  tools.className = 'tools';
  for (const [label, student] of [['In toàn bộ', false], ['In phần học và bài tập', true]]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      root.classList.toggle('print-student', student);
      window.print();
    });
    tools.append(button);
  }
  root.querySelector('h1').after(tools);
  window.addEventListener('beforeprint', () => {
    if (savedOpen === null) savedOpen = [...root.querySelectorAll('details')].map(d => [d, d.open]);
    savedOpen.forEach(([d]) => { d.open = true; });
  });
  window.addEventListener('afterprint', () => {
    (savedOpen || []).forEach(([d, open]) => { d.open = open; });
    savedOpen = null;
    root.classList.remove('print-student');
  });
  function reveal(hash) {
    let id;
    try { id = decodeURIComponent(hash.slice(1)); } catch { return; }
    const target = document.getElementById(id);
    if (!target || !root.contains(target)) return;
    for (let node = target; node && node !== root; node = node.parentElement) {
      if (node.tagName === 'DETAILS') node.open = true;
    }
    target.scrollIntoView({block: 'start'});
  }
  window.addEventListener('hashchange', () => reveal(location.hash));
  window.addEventListener('load', () => reveal(location.hash));
  root.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (link && root.contains(link)) reveal(link.hash);
  });
})();
</script>
