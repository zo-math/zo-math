schema_version: 1
architecture_version: "0.2"
matrix_version: "0.1"

package:
  id: R1-G01
  title: Đơn điệu và cực trị

source:
  qmd: ../index.qmd

policies:
  no_reuse_policy: single-evidence-role-v1
  foundation_catalog: on-thi-foundation-v1

objectives:
  - id: G01-M1
    description: Ghi đúng tập xác định, khoảng xét và điều kiện áp dụng định lí dấu đạo hàm.
    essential: true
    prerequisite_ids: []
    dependent_objective_ids: [G01-M2, G01-M3, G01-M4]
  - id: G01-M2
    description: Nối công thức, đạo hàm, dấu, chiều biến thiên, bảng và dáng điệu đồ thị.
    essential: true
    prerequisite_ids: [G01-M1]
    dependent_objective_ids: [G01-M3, G01-M4]
  - id: G01-M3
    description: Xét cực trị và phân biệt điểm cực trị, giá trị cực trị, điểm trên đồ thị.
    essential: true
    prerequisite_ids: [G01-M1, G01-M2]
    dependent_objective_ids: [G01-M5]
  - id: G01-M4
    description: Đọc ngược từ bảng hoặc đồ thị mà không thêm dữ kiện.
    essential: true
    prerequisite_ids: [G01-M1, G01-M2]
    dependent_objective_ids: [G01-M5]
  - id: G01-M5
    description: Đánh giá, phản biện và sửa một lập luận trong khi giữ phần đúng.
    essential: true
    prerequisite_ids: [G01-M3, G01-M4]
    dependent_objective_ids: []

stages:
