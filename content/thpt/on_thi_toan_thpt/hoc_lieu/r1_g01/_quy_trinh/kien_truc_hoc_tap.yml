    objective_ids: [G01-M1, G01-M2, G01-M3]
    learning_section_anchors:
      - từ-đi-lên-đến-định-nghĩa
      - dấu-đạo-hàm-cho-phép-kết-luận-gì
      - một-chuỗi-biểu-diễn-được-dựng-thế-nào
      - tách-riêng-điểm-không-thuộc-tập-xác-định
      - cực-trị-được-gọi-tên-thế-nào
    practice_task_ids: [G01-L01, G01-L02, G01-L03, G01-L04]
    checkpoint_id: CP-LT1
  - id: G01-C2
