# Bắt buộc ghi khi phát biểu trung tâm dùng các quan hệ như bảo toàn, giữ nguyên,
# phụ thuộc, làm mất, xác định được từ hoặc khôi phục được từ.
# Tránh các cụm mơ hồ như “giữ độ lớn”, “bảo toàn độ lớn”, “không xóa độ lớn”.
# Nếu một đại lượng thật sự được bảo toàn, nêu đúng đại lượng và đẳng thức kiểm chứng;
