vong_ra:
  nen_tang:
    - phuong_dien: doi_tuong
      trang_thai: dat
      ket_qua_chinh: Hàm số $f(x)=\sqrt{x}$ trên miền thực tự nhiên.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: tap_xac_dinh
      trang_thai: dat
      ket_qua_chinh: $D=[0,+\infty)$; $0$ là đầu mút thuộc miền.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: tap_gia_tri_va_tap_muc
      trang_thai: dat
      ket_qua_chinh: Chọn tập đích $[0,+\infty)$; tập giá trị cũng là $[0,+\infty)$.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: nghiem_dau_va_giao_truc
      trang_thai: dat
      ket_qua_chinh: Nghiệm duy nhất $x=0$; đồ thị đi qua $O(0,0)$ và dương khi $x>0$.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: hanh_vi_tai_bien_mien
      trang_thai: dat
      ket_qua_chinh: $f(x)\to0$ khi $x\to0^+$ và $f(x)\to+\infty$ khi $x\to+\infty$.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: lien_tuc_va_gian_doan
      trang_thai: dat
      ket_qua_chinh: Liên tục trên $[0,+\infty)$, không có gián đoạn trong miền.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: bien_thien
      trang_thai: dat
      ket_qua_chinh: $f'(x)=1/(2\sqrt{x})>0$ với $x>0$, nên hàm đồng biến trên miền.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: diem_dac_biet
      trang_thai: dat
      ket_qua_chinh: Tại $x=0$ không có đạo hàm hữu hạn; đồ thị có tiếp tuyến đứng $x=0$.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
    - phuong_dien: rang_buoc_do_thi
      trang_thai: dat
      ket_qua_chinh: Đồ thị nằm trong góc phần tư I và đối xứng với nhánh $y=x^2$, $x\geq0$, qua $y=x$.
      dua_vao_bai: true
      li_do: Đặc trưng nền tảng được triển khai trực tiếp trong bài.
  kich_hoat_khi_thich_hop:
    - phuong_dien: bi_chan_va_cuc_bien
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Bị chặn dưới bởi $0$, đạt giá trị nhỏ nhất $0$ tại $x=0$, không bị chặn trên.
      dua_vao_bai: true
      li_do: Được dùng trong mạch bài hoặc hệ bài tập.
    - phuong_dien: do_cong
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: $f''(x)=-1/(4x^{3/2})<0$ với $x>0$, nên đồ thị lõm xuống.
      dua_vao_bai: true
      li_do: Được dùng trong mạch bài hoặc hệ bài tập.
    - phuong_dien: doi_xung
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Quan hệ đối xứng qua $y=x$ xuất hiện với hàm ngược $x^2$ trên miền không âm.
