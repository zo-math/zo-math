menh_de_chung_cu: []

# Bắt buộc ghi khi phát biểu trung tâm dùng các quan hệ như bảo toàn, giữ nguyên,
# phụ thuộc, làm mất, xác định được từ hoặc khôi phục được từ.
# Tránh các cụm mơ hồ như “giữ độ lớn”, “bảo toàn độ lớn”, “không xóa độ lớn”.
# Nếu một đại lượng thật sự được bảo toàn, nêu đúng đại lượng và đẳng thức kiểm chứng;
# nếu đầu ra chỉ cho phép khôi phục một đại lượng, dùng “xác định được từ/khôi phục được từ”.
kiem_tra_quan_he_trung_tam:
  - phat_bieu: Phép lấy căn bậc hai là phép đảo của bình phương trên miền không âm.
    phep_thu: Kiểm tra $\sqrt{x}^2=x$ với $x\geq0$ và $\sqrt{y^2}=y$ với $y\geq0$.
    ket_luan: Hai hàm xác định được lẫn nhau trên $[0,+\infty)$.
    trang_thai: dat

truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu: Ràng buộc không âm chọn một nhánh của phép bình phương và quyết định hình dạng hàm căn.
    pham_vi: Trên $[0,+\infty)$
    vi_sao_dang_khao_sat: Quan hệ hàm ngược thống nhất miền, tập giá trị, biến thiên, đầu mút và đồ thị.
    trang_thai: dat
  cau_hoi_dan_duong: Vì sao việc chọn nghiệm không âm của phương trình bình phương quyết định toàn bộ đồ thị căn bậc hai?
  cau_tra_loi_da_kiem_tra: Hàm bình phương tăng và nhận mọi giá trị không âm trên $[0,+\infty)$, nên hàm ngược của nó là hàm căn; chứng minh đại số xác lập tính tăng và tính lõm, còn đạo hàm xác nhận cách đọc giải tích.
  nhan_thuc_co_the_chuyen_giao: Muốn tìm hàm ngược, trước hết phải chọn tập đang xét sao cho mỗi giá trị chỉ ứng với một đầu vào.
  chuoi_nen:
    hien_tuong: Hàm căn bắt đầu tại đầu mút $0$ và chỉ nhận giá trị không âm.
    co_che: Bình phương trên $[0,+\infty)$ tăng và nhận mọi giá trị không âm; phép lấy căn bậc hai số học là hàm ngược.
    chung_cu: Định nghĩa căn bậc hai số học, tập xác định, tập giá trị, chứng minh tính lõm, đạo hàm và giới hạn phải tại $0$.
    hinh_dang: Đồ thị tăng, lõm xuống, có tiếp tuyến đứng tại $O$ và đối xứng với nhánh parabol qua $y=x$.
    nhan_thuc: Muốn lấy hàm ngược phải chọn tập làm hàm ban đầu một-một.

ban_do_hien_tuong:
  - hien_tuong: Tập xác định và đầu mút
    co_che: Điều kiện biểu thức dưới căn không âm.
    chung_cu: $x\geq0$, $f(0)=0$.
    bieu_dien: Định nghĩa căn bậc hai số học, chứng minh giới hạn phải và bảng biến thiên hàng ngang.
    nhan_thuc: Đầu mút thuộc tập xác định nhưng công thức đạo hàm chỉ dùng khi $x>0$.
  - hien_tuong: Quan hệ hàm ngược
    co_che: Bình phương bị hạn chế trên nửa trục không âm.
    chung_cu: $(\sqrt{x})^2=x$ và $\sqrt{y^2}=y$ với các biến không âm.
    bieu_dien: Ba đường $y=\sqrt{x}$, $y=x^2$ và $y=x$ cùng tỉ lệ đơn vị.
    nhan_thuc: Hai đồ thị hàm ngược đối xứng qua $y=x$.

de_cuong_van_hanh:
  cac_mach_lap_luan:
    - Định nghĩa căn bậc hai số học đi trước tập xác định, tập giá trị và quan hệ hàm ngược.
    - Phép liên hợp chứng minh tính tăng; bất đẳng thức theo tổ hợp lồi chứng minh tính lõm trước khi dùng đạo hàm để xác nhận.
    - Chứng minh trực tiếp xác lập liên tục phải tại $0$, còn thương sai phân một phía giải thích tiếp tuyến đứng.
    - Hai đồ thị hàm ngược giải thích phép đối xứng qua $y=x$.
    - Độ lõm dẫn đến bất đẳng thức tiếp tuyến, hình tiếp tuyến và hai cách nhìn hình học về AM–GM.
    - Phần Nhìn lại quy tụ các đặc trưng bằng ngôn ngữ hàm số.
    - "Tám bài tập được tổ chức thành ba nhóm: dựng lại hàm căn từ nửa parabol, khảo sát biến thiên và đầu mút, rồi vận dụng vào tiếp tuyến, biến đổi và diện tích."
  mang_phu_thuoc:
    mach_can_truoc:
      - Định nghĩa căn bậc hai số học và tính một-một của bình phương trên $[0,+\infty)$ đi trước quan hệ hàm ngược.
      - Chứng minh đại số về tính lõm đi trước kết luận đồ thị nằm dưới tiếp tuyến và bất đẳng thức AM–GM.
    menh_de_can_truoc:
      - $g(x)=x^2$ tăng trên $[0,+\infty)$ và nhận mọi giá trị trong $[0,+\infty)$.
      - $f^\prime(x)>0$ và $f^{\prime\prime}(x)<0$ với $x>0$.
    bieu_dien_phu_thuoc:
      - Bảng biến thiên hàng ngang tổng hợp đầu mút, dấu đạo hàm và giá trị biên đã xác lập.
      - Hình thứ nhất soi chiếu quan hệ hàm ngược; hình thứ hai soi chiếu quan hệ giữa đồ thị lõm, tiếp tuyến và AM–GM.
    vong_tron_va_cach_pha:
      - Không có vòng tròn chứng cứ; tập xác định, tập giá trị, tính tăng và tính lõm được chứng minh trước khi dùng hình để soi chiếu.
  trat_tu_nhan_thuc:
    thu_tu:
      - Định nghĩa căn bậc hai số học, rồi xác định tập xác định và tập giá trị.
      - Chứng minh tính tăng, tính lõm và hành vi tại đầu mút.
      - Giải thích đồ thị bằng quan hệ của hai hàm ngược.
      - Dùng độ cong và tiếp tuyến để suy ra AM–GM rồi đối sánh hai hình ảnh hình học.
      - Nhìn lại rồi luyện tập theo ba nhóm, trong đó Bài 1–5 dựng lại các mắt xích chính trước khi Bài 6–8 chuyển sang hệ quả và vận dụng.
    li_do: Đi từ định nghĩa và tập xác định sang chứng cứ đại số, giải tích, sau đó dùng biểu diễn hình học và hệ quả mở rộng.
    diem_hinh_thanh_du_doan: Đoạn mở đầu gợi rằng ràng buộc không âm làm các đặc điểm của hàm căn cùng xuất hiện.
    diem_sua_truc_giac: Mục Điều xảy ra tại đầu mút phân biệt liên tục phải tại $0$ với việc không có đạo hàm hữu hạn tại đó.
    diem_ket_tinh: Mục Nhìn lại quy tập xác định, tập giá trị, quan hệ hàm ngược, biến thiên, độ lõm và tiếp tuyến đứng về định nghĩa căn bậc hai số học.
  muc_hien_thi:
    - Ba khối lí thuyết trong mạch chính và một khối đối sánh AM–GM.
    - Bảng biến thiên hàng ngang.
    - Hai đồ thị: quan hệ hàm ngược và quan hệ đồ thị–tiếp tuyến.
    - Hệ bài tập gồm ba nhóm với thứ tự phụ thuộc rõ ràng.
  kien_truc:
    khoi_mo: Nêu việc kí hiệu căn chỉ chọn nghiệm không âm và đặt câu hỏi về hệ quả của lựa chọn này.
    nhan_dien: Mục Từ căn bậc hai số học đến hàm số đặt định nghĩa trước khi xác lập tập xác định, tập giá trị, hàm ngược và đầu mút.
    trien_khai: Hai mục Tăng và lõm xuống cùng Độ cong tạo những bất đẳng thức hữu ích cung cấp chứng cứ đại số, giải tích và hình học.
    ket_tinh: Mục Nhìn lại trả lời câu hỏi mở đầu bằng quan hệ hàm ngược trên $[0,+\infty)$.
    soi_chieu: Hai hình lần lượt đối chiếu $y=\sqrt{x}$ với $y=x^2$ qua $y=x$, rồi đối chiếu đồ thị hàm căn với tiếp tuyến tại $(1,1)$.
    khep_lai: Phần Bài tập đi từ bình phương trên nửa trục không âm đến hàm căn, quan hệ đồ thị hàm ngược, biến thiên, đầu mút và độ lõm; sau đó mới chuyển sang bất đẳng thức tiếp tuyến, biến đổi đồ thị và diện tích.
  dieu_kien_dung_rieng:
    - Mỗi mạch chính có chứng cứ đại số hoặc giải tích trước khi kết luận bằng hình.

