    - ten: Tiếp tuyến, biến đổi và diện tích
      bai_so: [6, 7, 8]
      muc_tieu: Dùng tính lõm để suy ra bất đẳng thức, trường hợp dấu bằng và viết tiểu luận ngắn đối sánh hai hình ảnh trung bình cộng–trung bình nhân; theo dõi đầu mút, tập xác định, biến thiên cùng tiếp tuyến đứng qua phép dịch chuyển; rồi tính một diện tích theo $x$ và theo $y$ để làm rõ vai trò của quan hệ hàm ngược.
