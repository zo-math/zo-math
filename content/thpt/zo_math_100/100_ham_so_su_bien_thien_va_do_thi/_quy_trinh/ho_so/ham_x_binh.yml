menh_de_chung_cu:
  - menh_de: "Tập giá trị là [0,+∞)."
    chung_cu: "x²≥0 và với y≥0 có x=√y."
  - menh_de: "Hàm chẵn và đồ thị đối xứng qua trục tung."
    chung_cu: "f(-x)=f(x)."
  - menh_de: "Hàm nghịch biến trên (-∞,0] và đồng biến trên [0,+∞)."
    chung_cu: "Hiệu hai bình phương và dấu f^prime(x)=2x."
  - menh_de: "0 là giá trị nhỏ nhất duy nhất."
    chung_cu: "x²≥0, dấu bằng khi và chỉ khi x=0."

# Bắt buộc ghi khi phát biểu trung tâm dùng các quan hệ như bảo toàn, giữ nguyên,
# phụ thuộc, làm mất, xác định được từ hoặc khôi phục được từ.
# Tránh các cụm mơ hồ như “giữ độ lớn”, “bảo toàn độ lớn”, “không xóa độ lớn”.
# Nếu một đại lượng thật sự được bảo toàn, nêu đúng đại lượng và đẳng thức kiểm chứng;
# nếu đầu ra chỉ cho phép khôi phục một đại lượng, dùng “xác định được từ/khôi phục được từ”.
kiem_tra_quan_he_trung_tam:
  - phat_bieu: "Đầu ra x² xác định được trị tuyệt đối của đầu vào nhưng không xác định được dấu khi x khác 0."
    phep_thu: "Dựng công thức |x|=√(x²) và thử cặp x,-x với x khác 0."
    ket_luan: "Công thức khôi phục |x| đúng; cặp x,-x cho cùng đầu ra nên dấu không khôi phục duy nhất."
    trang_thai: dat

truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu: "Phép bình phương gấp hai nửa trục lên cùng miền giá trị không âm."
    pham_vi: "Toàn bộ R"
    vi_sao_dang_khao_sat: "Quan hệ này giải thích đồng thời tính chẵn, hai chiều biến thiên, cực tiểu, parabol và số nghiệm của x²=a."
    trang_thai: dat
  cau_hoi_dan_duong: "Điều gì còn được xác định và điều gì không còn phân biệt được sau phép bình phương?"
  cau_tra_loi_da_kiem_tra: "Trị tuyệt đối được xác định bởi căn bậc hai của đầu ra; dấu không được xác định trừ đầu vào 0."
  nhan_thuc_co_the_chuyen_giao: "Khi đọc một hàm nhiều–một, cần tách thông tin được khôi phục từ đầu ra khỏi thông tin bị đồng nhất."
  chuoi_nen:
    hien_tuong: "Hai đầu vào đối nhau có cùng ảnh."
    co_che: "Số mũ chẵn loại bỏ dấu và giữ trị tuyệt đối."
    chung_cu: "f(-x)=f(x), |x|=√f(x), dấu f^prime."
    hinh_dang: "Hai nhánh parabol đối xứng gặp tại đỉnh."
    nhan_thuc: "Đọc ngược mức y=a bằng miền giá trị và số tiền ảnh."

ban_do_hien_tuong:
  - thanh_phan: hien_tuong
    noi_dung: "x và -x cho cùng bình phương"
  - thanh_phan: co_che
    noi_dung: "đầu ra xác định |x| nhưng không xác định dấu"
  - thanh_phan: chung_cu
    noi_dung: "đẳng thức, bất đẳng thức, hiệu hai bình phương và đạo hàm"
  - thanh_phan: hinh_dang
    noi_dung: "parabol mở lên, đối xứng qua trục tung"
  - thanh_phan: nhan_thuc
    noi_dung: "số tiền ảnh thay đổi khi mức a đi qua giá trị nhỏ nhất 0"

