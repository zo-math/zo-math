he_khoi_noi_dung:
  co_su_dung: false
  li_do_khong_su_dung: Mạch cốt lõi cần đọc liên tục; văn xuôi, công thức, đề mục và một hình soi chiếu đã đủ phân cấp, không
    có nội dung phụ cần khối.
  cac_khoi: []
  lop_cu_phat_hien: []
  quyet_dinh_chuyen_doi: Không tạo block; không có lớp legacy để chuyển đổi.
tu_kiem_noi_dung:
  toan_hoc:
    trang_thai: dat
    tieu_chi:
    - id: TH01
      noi_dung: dung_doi_tuong_va_tap_xac_dinh
      trang_thai: dat
      can_cu:
      - Định nghĩa tại “Một nhánh của sin có thể đảo ngược” khóa D=[-1,1] và miền giá trị chính I; profile ban_do_mien khớp.
      hanh_dong_sua: null
    - id: TH02
      noi_dung: nhat_quan_cong_thuc_mien_ki_hieu_thuat_ngu_tham_so_va_quy_uoc
      trang_thai: dat
      can_cu:
      - QMD dùng nhất quán arcsin, I, miền [-1,1], radian và quy ước LaTeX hiện hành; không đổi kí hiệu giữa các mục.
      hanh_dong_sua: null
    - id: TH03
      noi_dung: dung_dieu_kien_va_pham_vi_cua_tung_menh_de
      trang_thai: dat
      can_cu:
      - Hai đẳng thức sin(arcsin x) và arcsin(sin y) đều ghi miền; đạo hàm ghi rõ -1<x<1.
      hanh_dong_sua: null
    - id: TH04
      noi_dung: xu_li_truong_hop_bien_suy_bien_va_ngoai_le
      trang_thai: dat
      can_cu:
      - Hai đầu mút x=±1 được tách khỏi miền đạo hàm; ví dụ 3pi/4 xử lí trường hợp ngoài nhánh chính.
      hanh_dong_sua: null
    - id: TH05
      noi_dung: phan_biet_ton_tai_duy_nhat_va_tinh_day_du
      trang_thai: dat
      can_cu:
      - Định nghĩa arcsin nêu “có đúng một y trong I”; chứng cứ là song ánh sin|I, không chỉ nêu tồn tại.
      hanh_dong_sua: null
    - id: TH06
      noi_dung: khong_ket_luan_vuot_qua_chung_cu
      trang_thai: dat
      can_cu:
      - Hình chỉ được dùng sau chứng minh song ánh/đổi tọa độ; đoạn đọc ngược nói rõ hình không thay chứng minh.
      hanh_dong_sua: null
    - id: TH07
      noi_dung: ket_qua_so_co_muc_bao_dam_dung
      trang_thai: dat
      can_cu:
      - Bài không dựa vào xấp xỉ số; các hằng số pi/2 và căn bậc hai đều giữ dạng chính xác.
      hanh_dong_sua: null
    - id: TH08
      noi_dung: cong_thuc_bang_hinh_va_van_xuoi_khong_mau_thuan
      trang_thai: dat
      can_cu:
      - QMD và đặc tả hình cùng dùng các đầu mút (-1,-pi/2),(1,pi/2), đối xứng y=x và miền đúng.
      hanh_dong_sua: null
    - id: TH09
      noi_dung: khong_co_vong_tron_chung_cu
      trang_thai: dat
      can_cu:
      - Quan hệ đồ thị được suy từ định nghĩa hàm ngược trước khi chèn hình; không dùng hình để chứng minh định nghĩa.
      hanh_dong_sua: null
    - id: TH10
      noi_dung: phan_biet_tinh_chat_va_dai_luong_trong_thuat_ngu
      trang_thai: dat
      can_cu:
      - Các thuật ngữ miền xác định, tập giá trị, độ dốc, tính tăng và hàm ngược được dùng đúng loại đối tượng.
      hanh_dong_sua: null
    - id: TH11
      noi_dung: bang_dao_ham_xu_li_dau_mut_theo_mien_dao_ham
      trang_thai: dat
      can_cu:
      - Mục đạo hàm nêu công thức chỉ trên (-1,1), còn ±1 vẫn thuộc tập xác định; xử lí đúng đầu mút.
      hanh_dong_sua: null
    - id: TH12
      noi_dung: phan_biet_diem_doan_do_dai_va_dai_luong_vo_huong
      trang_thai: dat
      can_cu:
      - Các biểu thức tọa độ được gọi là điểm; độ dốc và giá trị hàm không bị gọi nhầm thành độ dài.
      hanh_dong_sua: null
  mach_giai_thich:
    trang_thai: dat
    tieu_chi:
    - id: MG01
      noi_dung: cau_hoi_dan_duong_dieu_khien_viec_chon_noi_dung
      trang_thai: dat
      can_cu:
      - Câu hỏi dẫn đường trong profile và mở bài cùng xoay quanh việc giới hạn sin để đảo và dấu vết của phép đảo.
      hanh_dong_sua: null
    - id: MG02
      noi_dung: ban_do_hien_tuong_du_nam_thanh_phan
      trang_thai: dat
      can_cu:
      - ban_do_hien_tuong có đủ hien_tuong/co_che/dau_hieu/chung_cu/bieu_dien, mỗi thành phần gắn trực tiếp với bài.
      hanh_dong_sua: null
    - id: MG03
      noi_dung: moi_mach_du_sau_chuc_nang
      trang_thai: dat
      can_cu:
      - 'Mỗi mạch M1–M5 trong de_cuong_van_hanh có đủ vai trò: vấn đề, cơ chế, chứng cứ, hệ quả/biểu diễn và nối tiếp.'
      hanh_dong_sua: null
    - id: MG04
      noi_dung: quan_he_phu_thuoc_duoc_ton_trong
      trang_thai: dat
      can_cu:
      - Trật tự bài đi song ánh → định nghĩa → tính chất → đồ thị → đạo hàm; các phụ thuộc MD01–MD05 được tôn trọng.
      hanh_dong_sua: null
    - id: MG05
      noi_dung: trat_tu_nhan_thuc_hop_li
      trang_thai: dat
      can_cu:
      - Ví dụ phản ví dụ sửa trực giác trước khi dùng phép hợp; hình xuất hiện sau chứng minh; đạo hàm sau khi khóa miền.
      hanh_dong_sua: null
    - id: MG06
      noi_dung: moi_phan_co_chuc_nang
      trang_thai: dat
      can_cu:
      - Bốn H2 trước Bài tập lần lượt làm nhiệm vụ định nghĩa, hệ quả đổi vai, vi phân và kết tinh; không có mục thừa.
      hanh_dong_sua: null
    - id: MG07
      noi_dung: bang_va_hinh_tong_hop_ket_qua_da_xac_lap
      trang_thai: dat
      can_cu:
      - Hình ham_arcsin_x tổng hợp các kết quả đã xác lập; không có bảng/hình dùng để mở kết luận chưa chứng minh.
      hanh_dong_sua: null
    - id: MG08
      noi_dung: co_phan_doc_nguoc_sau_bieu_dien
      trang_thai: dat
      can_cu:
      - Đoạn ngay sau hình truy ngược đầu mút và hình dạng về phép đổi tọa độ, đồng thời nêu giới hạn của hình.
      hanh_dong_sua: null
    - id: MG09
      noi_dung: ket_luan_tra_loi_cau_hoi_mo_dau
      trang_thai: dat
      can_cu:
      - 'Mục “Kết tinh” trả lời trực tiếp: phải khóa miền một-một của sin trước rồi mới đảo; nối cả đồ thị và đạo hàm.'
      hanh_dong_sua: null
    - id: MG10
      noi_dung: ham_phu_va_ten_phu_chi_dung_khi_giam_tai_nhan_thuc
      trang_thai: dat
      can_cu:
      - Chỉ dùng I để giảm lặp miền chính; không tạo hàm phụ hoặc tên trung gian không cần thiết trong mạch chính.
      hanh_dong_sua: null
    - id: MG11
      noi_dung: nhan_manh_theo_chuc_nang_khong_thay_cau_truc_lap_luan
      trang_thai: dat
      can_cu:
      - Không dùng block hay nhấn mạnh thị giác thay cho lập luận; nhấn mạnh nằm ở cấu trúc heading, công thức và hình.
      hanh_dong_sua: null
  gia_tri_nhan_thuc:
    trang_thai: dat
    tieu_chi:
    - id: NT01
      noi_dung: hien_tuong_trung_tam_du_dac_trung
      trang_thai: dat
      can_cu:
      - Hiện tượng “một nhánh sin đảo được” đặc trưng cho arcsin và gắn trực tiếp với sự cần thiết của miền giá trị chính.
      hanh_dong_sua: null
    - id: NT02
      noi_dung: bai_lam_ro_co_che_khong_chi_liet_ke
      trang_thai: dat
      can_cu:
      - Bài giải thích cơ chế song ánh/đổi vai/đổi tọa độ/đạo hàm ẩn thay vì liệt kê một checklist tính chất.
      hanh_dong_sua: null
    - id: NT03
      noi_dung: khai_niem_moi_xuat_hien_dung_luc
      trang_thai: dat
      can_cu:
      - Khái niệm hàm ngược xuất hiện ngay sau khi giải thích vì sao sin toàn cục không đảo được và nhánh I là song ánh.
      hanh_dong_sua: null
    - id: NT04
      noi_dung: chi_tiet_ki_thuat_khong_che_mach_chinh
      trang_thai: dat
      can_cu:
      - Độ cong và công thức đạo hàm hàm ngược tổng quát được đẩy sang Bài 6–7 để mạch chính không bị kĩ thuật che lấp.
      hanh_dong_sua: null
    - id: NT05
      noi_dung: phan_mo_rong_khong_cat_mach_chinh
      trang_thai: dat
      can_cu:
      - Phần phát triển chỉ nằm sau khi Kết tinh và trong Bài tập, nên không cắt mạch xác lập arcsin.
      hanh_dong_sua: null
    - id: NT06
      noi_dung: phep_soi_chieu_co_gia_tri
      trang_thai: dat
      can_cu:
      - Soi chiếu sin|I với arcsin trên cùng hệ trục làm nhìn thấy đúng phép đổi tọa độ đã chứng minh.
      hanh_dong_sua: null
    - id: NT07
      noi_dung: diem_ket_tinh_lam_hien_quan_he
      trang_thai: dat
      can_cu:
      - Kết tinh nối miền một-một, phép hợp, phản chiếu đồ thị và đạo hàm vào cùng một cơ chế.
      hanh_dong_sua: null
    - id: NT08
      noi_dung: bai_de_lai_cach_nhin_co_the_chuyen_giao
      trang_thai: dat
      can_cu:
      - Bài 7 chuyển giao công thức đạo hàm hàm ngược; Kết tinh nêu quy tắc theo dõi miền có thể dùng cho hàm ngược khác.
      hanh_dong_sua: null
    - id: NT09
      noi_dung: cach_nhin_moi_van_yeu_cau_kiem_tra_dieu_kien
      trang_thai: dat
      can_cu:
      - Ví dụ 3pi/4 và Bài 5 buộc người học kiểm tra miền trước khi dùng arcsin(sin t)=t.
      hanh_dong_sua: null
    - id: NT10
      noi_dung: ket_tinh_nen_cach_nhin_khong_chi_tom_tat
      trang_thai: dat
      can_cu:
      - 'Kết tinh không chỉ lặp kết quả mà nêu quy trình tư duy: khóa miền một-một rồi theo dõi việc đổi vai đầu vào–đầu ra.'
      hanh_dong_sua: null
  he_thong_bai_tap:
    ap_dung_theo_ho_so: true
    li_do_khong_ap_dung: null
    trang_thai: dat
    tieu_chi:
    - id: BT01
      noi_dung: gia_thiet_va_du_lieu_day_du_nhat_quan
      trang_thai: dat
      can_cu:
      - Bảy bài đều nêu đủ miền/giả thiết; Bài 4 và Bài 6 ghi miền -1<x<1, Bài 7 ghi điều kiện g' >0.
      hanh_dong_sua: null
    - id: BT02
      noi_dung: yeu_cau_xac_dinh_va_giai_duoc
      trang_thai: dat
      can_cu:
      - Mỗi tiểu mục dùng yêu cầu xác định như chứng minh, tính, phác họa, giải thích; không có câu hỏi mơ hồ.
      hanh_dong_sua: null
    - id: BT03
      noi_dung: ket_qua_mong_doi_hoac_loi_giai_tham_chieu_dung
      trang_thai: dat
      can_cu:
      - he_thong_bai_tap.hop_dong.bai_tap ghi ket_qua_mong_doi cho cả 7 bài để agent tự đối chiếu tính đúng.
      hanh_dong_sua: null
    - id: BT04
      noi_dung: thu_tu_ton_trong_quan_he_phu_thuoc
      trang_thai: dat
      can_cu:
      - Nhóm 1 dựng MX01–MX05 trước; nhóm 2 chỉ phát triển từ các mắt xích đã có, đúng bản đồ phụ thuộc.
      hanh_dong_sua: null
    - id: BT05
      noi_dung: he_bai_tap_tiep_tuc_muc_tieu_nhan_thuc
      trang_thai: dat
      can_cu:
      - Bài 1–4 phủ toàn bộ mạch cốt lõi; Bài 5–7 phát triển đúng ba hướng nảy sinh từ cơ chế hàm ngược.
      hanh_dong_sua: null
    - id: BT06
      noi_dung: phan_vuot_pham_vi_duoc_goi_dung_la_mo_rong
      trang_thai: dat
      can_cu:
      - Learner-facing headings dùng tên toán học tự nhiên; không lộ nhãn nội bộ “tái dựng/phát triển” như tiêu đề nhóm.
      hanh_dong_sua: null
  he_khoi_noi_dung:
    kich_hoat: true
    trang_thai: dat
    tieu_chi:
    - id: KH01
      noi_dung: moi_khoi_thuc_su_can_thiet
      trang_thai: dat
      can_cu:
      - he_khoi_noi_dung.co_su_dung=false vì không có nội dung phụ cần đóng khối; tránh tạo block không cần thiết.
      hanh_dong_sua: null
    - id: KH02
      noi_dung: trang_thai_hien_thi_phu_hop_voi_mach_chinh
      trang_thai: dat
      can_cu:
      - Không có block nên không có trạng thái mở/thu gọn làm gián đoạn mạch chính.
      hanh_dong_sua: null
    - id: KH03
      noi_dung: mau_theo_dung_chuc_nang_noi_dung
      trang_thai: dat
      can_cu:
      - Không có màu block; phân cấp thị giác được giao cho heading và figure đúng chức năng.
      hanh_dong_sua: null
    - id: KH04
      noi_dung: tieu_de_goi_dung_noi_dung_hoac_vai_tro
      trang_thai: dat
      can_cu:
      - Không có tiêu đề block cần kiểm tra; các heading nội dung gọi đúng vai trò toán học.
      hanh_dong_sua: null
    - id: KH05
      noi_dung: cu_phap_lop_hien_hanh_va_day_du
      trang_thai: dat
      can_cu:
      - QMD không chứa .zo-block, details zo-block hoặc lớp legacy; cú pháp figure dùng content-visible hiện hành.
      hanh_dong_sua: null
    - id: KH06
      noi_dung: khong_thu_gon_mat_xich_bat_buoc
      trang_thai: dat
      can_cu:
      - Không có mắt xích bắt buộc nào bị thu gọn; toàn bộ định nghĩa, chứng minh cốt lõi và đề bài hiển thị trực tiếp.
      hanh_dong_sua: null
    - id: KH07
      noi_dung: lop_cu_duoc_nhan_dien_va_xu_li_dung_pham_vi
      trang_thai: dat
      can_cu:
      - he_khoi_noi_dung.lop_cu_phat_hien rỗng; không có cấu trúc legacy trong candidate.
      hanh_dong_sua: null
    - id: KH08
      noi_dung: khong_dung_khoi_chi_de_tao_nhan_manh_thi_giac
      trang_thai: dat
      can_cu:
      - Không dùng block để tạo nhấn mạnh thị giác; quyết định không dùng block được ghi rõ trong profile.
      hanh_dong_sua: null
