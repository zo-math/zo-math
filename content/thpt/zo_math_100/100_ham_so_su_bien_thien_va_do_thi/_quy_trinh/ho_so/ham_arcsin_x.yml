menh_de_chung_cu:
- id: MD01
  menh_de: sin trên I=[-pi/2,pi/2] là song ánh lên [-1,1].
  chung_cu: Tính liên tục, tăng nghiêm ngặt trên I và hai giá trị đầu mút -1, 1.
  vai_tro: Cho phép định nghĩa duy nhất arcsin.
- id: MD02
  menh_de: D_arcsin=[-1,1] và Im(arcsin)=I.
  chung_cu: Miền và tập giá trị đổi vai khi lấy hàm ngược của song ánh sin|I.
  vai_tro: Khóa miền của mọi phát biểu tiếp theo.
- id: MD03
  menh_de: arcsin tăng nghiêm ngặt, liên tục và lẻ trên [-1,1].
  chung_cu: Thứ tự của song ánh tăng; định lí liên tục của hàm ngược đơn điệu liên tục; tính lẻ của sin cộng tính duy nhất.
  vai_tro: Ràng buộc hình dạng toàn cục.
- id: MD04
  menh_de: Đồ thị arcsin là ảnh đối xứng của nhánh sin chính qua y=x.
  chung_cu: (y,sin y) chuyển thành (sin y,y) theo định nghĩa hàm ngược.
  vai_tro: Dựng toàn bộ đường cong không bằng nội suy hữu hạn.
- id: MD05
  menh_de: (arcsin x)'=1/sqrt(1-x^2) với -1<x<1.
  chung_cu: Lấy đạo hàm sin y=x và dùng cos y>0 trên miền trong của nhánh chính.
  vai_tro: Kiểm tra tính tăng và giải thích độ dốc ở hai đầu mút.
kiem_tra_quan_he_trung_tam:
- phat_bieu: Đồ thị y=arcsin x là ảnh đối xứng của nhánh y=sin x, x thuộc [-pi/2,pi/2], qua y=x.
  phep_thu: Lấy điểm tùy ý (t,sin t) trên nhánh chính; đổi thứ tự tọa độ thành (sin t,t) và kiểm tra định nghĩa arcsin(sin
    t)=t trên đúng miền.
  ket_luan: Mọi điểm của nhánh sin và mọi điểm của đồ thị arcsin ghép cặp hai chiều bằng phép đổi tọa độ, nên quan hệ đối
    xứng áp dụng cho toàn bộ hai đồ thị.
  trang_thai: dat
- phat_bieu: Công thức arcsin(sin t)=t chỉ áp dụng khi t thuộc nhánh chính.
  phep_thu: 'Thử t=3pi/4: sin t=sqrt(2)/2 nhưng arcsin(sqrt(2)/2)=pi/4.'
  ket_luan: Điều kiện t thuộc [-pi/2,pi/2] là thiết yếu; không được mở rộng đẳng thức ra toàn R.
  trang_thai: dat
truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu: Một nhánh sin trở thành hàm arcsin khi đầu vào và đầu ra được đổi vai; cùng phép đổi vai ấy xuất hiện trong
      miền–tập giá trị, đồ thị và đạo hàm.
    pham_vi: sin giới hạn trên I=[-pi/2,pi/2] và hàm arcsin trên [-1,1].
    vi_sao_dang_khao_sat: Nó giải thích đồng thời vì sao phải giới hạn miền của sin và vì sao các tính chất của arcsin có
      hình dạng hiện tại, thay vì liệt kê từng kết quả rời.
    trang_thai: dat
  cau_hoi_dan_duong: Phải giới hạn hàm sin thế nào để đảo được, và phép đảo đó được nhìn thấy ra sao trong đồ thị cùng đạo
    hàm của arcsin?
  cau_tra_loi_da_kiem_tra: Giới hạn sin trên [-pi/2,pi/2] tạo một song ánh lên [-1,1]; hàm ngược arcsin đổi vai miền–tập giá
    trị, phản chiếu đồ thị qua y=x và có đạo hàm là nghịch đảo độ dốc của nhánh sin tại điểm tương ứng.
  nhan_thuc_co_the_chuyen_giao: Với một hàm ngược, phải khóa miền một-một của hàm gốc trước rồi mới dùng công thức hợp, quan
    hệ đồ thị và đạo hàm.
  chuoi_nen:
    hien_tuong: Hàm sin toàn cục không đảo được nhưng một nhánh đơn điệu thì đảo được.
    co_che: Chọn nhánh sin song ánh rồi đổi vai đầu vào–đầu ra.
    chung_cu: Song ánh sin|I, hai đẳng thức hợp có miền, đổi tọa độ, đạo hàm ẩn.
    hinh_dang: Đồ thị arcsin phản chiếu nhánh sin qua y=x và tiến đến phương thẳng đứng ở hai đầu mút.
    nhan_thuc: Miền của hàm gốc là một phần của định nghĩa khi nói về hàm ngược.
ban_do_hien_tuong:
- thanh_phan: hien_tuong
  noi_dung: Từ một hàm sin tuần hoàn, chọn đúng một nhánh để có thể đảo và sinh ra arcsin.
- thanh_phan: co_che
  noi_dung: Nhánh sin trên I là song ánh; hàm ngược đổi vai đầu vào và đầu ra.
- thanh_phan: dau_hieu
  noi_dung: Miền và tập giá trị đổi vị trí; hai đồ thị đối xứng qua y=x; công thức hợp có điều kiện; độ dốc của arcsin lớn
    ở hai đầu.
- thanh_phan: chung_cu
  noi_dung: Tính tăng và liên tục của sin trên I, tính duy nhất của nghịch ảnh, phép đổi tọa độ và đạo hàm từ sin y=x.
- thanh_phan: bieu_dien
  noi_dung: Một hình vuông đặt nhánh sin, arcsin và y=x trên cùng hệ trục; văn xuôi đọc ngược ngay sau hình.
de_cuong_van_hanh:
  cac_mach_lap_luan:
  - id: M1
    noi_dung: Khóa nhánh sin chính và định nghĩa arcsin; sửa trực giác “arcsin xóa sin” bằng miền của hai đẳng thức hợp.
  - id: M2
    noi_dung: Đổi vai miền–tập giá trị; suy ra tính tăng, liên tục, tính lẻ, dấu và cực biên.
  - id: M3
    noi_dung: Đổi tọa độ để dựng đồ thị bằng đối xứng qua y=x và đọc ngược các ràng buộc.
  - id: M4
    noi_dung: Lấy đạo hàm từ sin y=x; giải thích độ dốc ở hai đầu mút.
  - id: M5
    noi_dung: Kết tinh cơ chế hàm ngược rồi chuyển giao qua bài tập.
  mang_phu_thuoc:
    mach_can_truoc:
    - M1 trước M2–M4; M2 trước phần đọc đồ thị; M3 và M4 cùng hội tụ ở Kết tinh.
    menh_de_can_truoc:
    - MD01 trước MD02–MD05; MD02 trước mọi điều kiện miền; MD04 không dùng hình để chứng minh chính nó.
    bieu_dien_phu_thuoc:
    - Hình ham_arcsin_x chỉ dựng sau MD01–MD04; hình biểu diễn kết quả đã xác lập.
    vong_tron_va_cach_pha:
    - Không dùng hình để chứng minh tính tăng hoặc quan hệ hàm ngược; các tính chất được chứng minh trước, hình chỉ soi chiếu
      và tổng hợp.
  trat_tu_nhan_thuc:
    thu_tu:
    - nhánh sin chính
    - định nghĩa và miền của hai phép hợp
    - miền–tập giá trị và tính chất
    - đồ thị phản chiếu
    - đạo hàm
    - kết tinh
    - bài tập
    li_do: Đi từ điều kiện tồn tại của hàm ngược tới hệ quả đại số, rồi mới chuyển sang hình và vi phân; tránh dùng biểu diễn
      làm chứng cứ vòng tròn.
    diem_hinh_thanh_du_doan: Ngay sau khi đổi vai miền–tập giá trị, người đọc có thể dự đoán đồ thị arcsin từ nhánh sin.
    diem_sua_truc_giac: Ví dụ arcsin(sin 3pi/4)=pi/4 sửa trực giác rằng arcsin luôn triệt tiêu sin.
    diem_ket_tinh: 'Mục “Kết tinh”: miền một-một của hàm gốc là điều kiện phải theo dõi trong mọi phép đảo.'
  muc_hien_thi:
  - noi_dung: Định nghĩa, hai phép hợp, miền–tập giá trị, tính tăng, lẻ, đồ thị, đạo hàm
    vai_tro: cốt lõi
    muc: mach_chinh
    li_do: Trực tiếp trả lời câu hỏi dẫn đường.
  - noi_dung: Độ cong, công thức arcsin(sin t) trên các khoảng khác, công thức đạo hàm hàm ngược tổng quát
    vai_tro: phát triển
    muc: bai_tap
    li_do: Đi tiếp từ cơ chế mà không làm nặng mạch chính.
  kien_truc:
    khoi_mo: Nêu thất bại của sin toàn cục khi đảo và nhu cầu chọn nhánh.
    nhan_dien: Định nghĩa arcsin từ song ánh sin|I và khóa miền hai phép hợp.
    trien_khai: Suy miền–tập giá trị, tính chất, hình phản chiếu và đạo hàm.
    ket_tinh: 'Nén cơ chế: khóa miền một-một rồi đổi vai đầu vào–đầu ra.'
    soi_chieu: Đặt nhánh sin và arcsin cùng y=x trên một hình chính xác.
    khep_lai: Hệ bài tập tái dựng toàn mạch rồi phát triển sang phép hợp ngoài nhánh, độ cong và đạo hàm hàm ngược.
  dieu_kien_dung_rieng:
  - Không mở rộng sang arccos/arctan hoặc ứng dụng ngoài bài.
  - Không đưa công thức từng đoạn toàn R của arcsin(sin t) vào mạch chính; chỉ phát triển qua bài tập.
ho_so_bieu_dien:
- id: fig-ham-arcsin-x
  menh_de_trung_tam: Đồ thị arcsin là ảnh đối xứng của nhánh sin chính qua y=x.
  chuc_nang: soi_chieu_va_tong_hop
  mien_toan_hoc: 'Nhánh sin: x trong [-pi/2,pi/2]; arcsin: x trong [-1,1].'
  mien_thi_giac: Cửa sổ vuông x,y trong [-1.8,1.8], bảo toàn tỉ lệ đơn vị để phép đối xứng qua y=x có ý nghĩa hình học.
  chi_tiet_bat_buoc:
  - arcsin là đường chính màu đỏ
  - nhánh sin là đường phụ
  - y=x là đường tham chiếu nét đứt
  - hai đầu mút arcsin là điểm đóng
  - ticks -pi/2,-1,0,1,pi/2 trên hai trục
  chi_tiet_loai_bo:
  - lưới
  - bảng giá trị rời rạc
  - các nhãn điểm không cần thiết
  gioi_han_bieu_dien: Hình chỉ tổng hợp quan hệ đã chứng minh; không thay thế chứng minh song ánh, tính tăng hay đạo hàm.
  doc_nguoc: Sau hình, văn xuôi truy hai đầu mút và toàn bộ đường cong về phép đổi tọa độ của hàm ngược.
