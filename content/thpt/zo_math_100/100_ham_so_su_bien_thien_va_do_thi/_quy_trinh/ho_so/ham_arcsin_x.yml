  li_do_khong_kich_hoat: null
  trang_thai_thiet_ke: dat
  muc_tieu:
  - tai_dung_mach_cot_loi
  - phat_trien_tu_mach_cot_loi
  nhom_bai:
  - ten: Nhánh sin và phép đảo
    bai_so:
    - 1
    - 2
    - 3
    - 4
    muc_tieu: Dựng lại điều kiện tồn tại của arcsin, miền–tập giá trị, tính chất, đồ thị và đạo hàm.
  - ten: Từ cơ chế hàm ngược đến những hệ quả mới
    bai_so:
    - 5
    - 6
    - 7
    muc_tieu: Phát triển cơ chế sang phép hợp ngoài nhánh chính, độ cong và công thức đạo hàm hàm ngược.
  co_goi_y: false
  co_dap_an: false
  co_loi_giai: false
  hop_dong:
    mach_cot_loi:
    - id: MX01
      noi_dung: Giới hạn sin trên I=[-pi/2,pi/2] để có song ánh và định nghĩa arcsin.
    - id: MX02
      noi_dung: Hai đẳng thức hợp hàm có miền áp dụng khác nhau.
    - id: MX03
      noi_dung: Miền–tập giá trị, tính tăng, liên tục, tính lẻ, nghiệm và cực biên của arcsin.
    - id: MX04
      noi_dung: Đồ thị arcsin thu từ nhánh sin bằng đổi tọa độ/đối xứng qua y=x.
    - id: MX05
      noi_dung: Đạo hàm (arcsin x)'=1/sqrt(1-x^2) trên (-1,1) và hành vi độ dốc ở đầu mút.
    bai_tap:
    - so: 1
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX01
      - MX02
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Xác lập song ánh sin|I, định nghĩa và miền chính xác của hai phép hợp; arcsin(sin 5pi/6)=pi/6.
    - so: 2
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX03
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Chứng minh tăng, lẻ; nghiệm 0; dấu theo x; min/max tại hai đầu; D và Im đúng.
    - so: 3
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX04
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Dựng toàn đồ thị bằng đối xứng, không suy hình dạng từ ba điểm.
    - so: 4
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX05
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Suy công thức đạo hàm trên (-1,1), giới hạn độ dốc +infinity ở hai đầu và phân biệt miền hàm với miền
        đạo hàm.
    - so: 5
      chuc_nang:
      - phat_trien
      tai_dung_mat_xich: []
      phat_trien_tu_mat_xich:
      - MX01
      - MX02
      ket_qua_mong_doi: F(t)=t trên nhánh chính; F(t)=pi-t trên [pi/2,3pi/2]; F(t)=t-2pi trên [3pi/2,5pi/2].
    - so: 6
      chuc_nang:
      - phat_trien
      tai_dung_mat_xich: []
      phat_trien_tu_mat_xich:
      - MX03
      - MX05
      ket_qua_mong_doi: f''(x)=x/(1-x^2)^(3/2); đổi dấu tại 0 và O là điểm uốn.
    - so: 7
      chuc_nang:
      - phat_trien
      tai_dung_mat_xich: []
      phat_trien_tu_mat_xich:
      - MX01
      - MX05
      ket_qua_mong_doi: h'(x)=1/g'(h(x)); áp dụng cho g=sin thu công thức arcsin.
    xac_nhan_agent:
      tai_dung: dat
