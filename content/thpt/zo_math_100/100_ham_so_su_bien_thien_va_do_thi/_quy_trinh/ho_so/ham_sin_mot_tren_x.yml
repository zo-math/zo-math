  - z_n,c_n hội tụ về 0
  gioi_han: chỉ biểu diễn hữu hạn dao động
  bo_cuc: mo_rong_html
- id: fig-sin-mot-tren-x-toan-canh
  muc_dich: Kết tinh tính đối xứng, dải giá trị, dao động gần 0 và hành vi ở vô cực.
  du_lieu: toàn cảnh hai nhánh
