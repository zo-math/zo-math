menh_de_chung_cu:
- menh_de: Tập xác định là \mathbb R\setminus\{0\}, tập giá trị là [-1,1].
  chung_cu: 1/x xác định với x\ne0 và nhận mọi giá trị thực khác 0; sin vẫn đạt mọi giá trị trong [-1,1] tại các đầu vào khác
    0.
- menh_de: Hàm lẻ và đồ thị nhận gốc tọa độ làm tâm đối xứng.
  chung_cu: f(-x)=\sin(-1/x)=-f(x), với miền xác định đối xứng qua 0.
- menh_de: Khi |x|\to\infty, f(x)\to0 và đồ thị bám sát y=1/x.
  chung_cu: 1/x\to0 và \sin u/u\to1 khi u\to0.
- menh_de: Gần 0, nghiệm z_n=1/(n\pi) và các hoành độ cực trị c_n=2/((2n+1)\pi) cùng dồn về 0.
  chung_cu: Giải \sin(1/x)=0 và \sin(1/x)=\pm1; QMD hiện hữu trình bày thứ tự xen kẽ.
- menh_de: Giới hạn tại 0 không tồn tại.
  chung_cu: Các dãy tiến về 0 qua cực đại và cực tiểu cho các giá trị giới hạn khác nhau.
truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu: 'Phép nghịch đảo sắp xếp lại nhịp tuần hoàn của hàm sin: ở xa 0 đồ thị lặng dần, còn gần 0 vô hạn dao động
      bị nén theo phương ngang mà biên độ vẫn nằm trong [-1,1].'
    pham_vi: \mathbb R\setminus\{0\}
    vi_sao_dang_khao_sat: Một cơ chế hợp hàm giải thích đồng thời hành vi ở vô cực, sự dồn sít gần 0, các dãy nghiệm/cực trị
      và giới hạn.
    trang_thai: rut_ra_tu_bai_hien_huu
  cau_hoi_dan_duong: Phép nghịch đảo thay đổi cách các dao động của hàm sin xuất hiện trên trục x như thế nào?
  cau_tra_loi_da_kiem_tra: Khi x ra xa 0 thì 1/x tiến về 0; khi x tiến về 0 thì 1/x đi qua vô hạn chu kì của sin, khiến các
    dao động dồn sít theo phương ngang.
  nhan_thuc_co_the_chuyen_giao: Trong hợp hàm, biến đổi ở đầu vào có thể thay đổi mật độ và vị trí của hiện tượng mà không
    thay đổi cơ chế của hàm ngoài.
  chuoi_nen:
    hien_tuong: hai hành vi trái ngược ở vô cực và gần 0
    co_che: u=1/x đảo cách di chuyển của đầu vào hàm sin
    chung_cu: giới hạn, dãy nghiệm/cực trị, đạo hàm và so sánh
    hinh_dang: dao động dồn về 0, hai nhánh tiến về y=0 ở vô cực
    nhan_thuc: đầu vào quyết định mật độ dao động; nhân tử ngoài có thể quyết định biên độ
ban_do_hien_tuong:
- hien_tuong: đồ thị lặng dần ở vô cực
  co_che: 1/x\to0
  dau_hieu: f(x)\to0 và f(x)/(1/x)\to1
  chung_cu: tính liên tục của sin tại 0 và \sin u/u\to1
  bieu_dien: đồ thị toàn cảnh
- hien_tuong: dao động dồn sít gần 0
  co_che: '|1/x|\to\infty'
  dau_hieu: vô hạn nghiệm và cực trị cùng hội tụ về 0
  chung_cu: các dãy z_n và c_n
  bieu_dien: hình phóng đại
- hien_tuong: một nửa đồ thị xác định nửa còn lại
  co_che: tính lẻ
  dau_hieu: f(-x)=-f(x)
  chung_cu: đại số
  bieu_dien: đối xứng qua gốc tọa độ
- hien_tuong: dao động vô hạn không tự nó phá giới hạn
  co_che: biên độ và mật độ dao động là hai vai trò khác nhau
  dau_hieu: x\sin(1/x)\to0
  chung_cu: '|x\sin(1/x)|\le|x|'
  bieu_dien: hình soi chiếu
de_cuong_van_hanh:
  cac_mach_lap_luan:
  - id: M1
    van_de: Công thức hợp hàm tạo ra hai thang hành vi nào?
    chung_cu: u=1/x cùng các giới hạn của u
    ket_luan: xa 0 thì lặng dần, gần 0 thì dao động dồn sít
    giai_nghia: phép nghịch đảo sắp xếp lại nhịp sin trên trục x
  - id: M2
    van_de: Các mốc dao động được tổ chức ra sao?
    chung_cu: z_n, c_n và dấu đạo hàm
    ket_luan: nghiệm và cực trị xen kẽ, khoảng đơn điệu dồn về 0
    giai_nghia: một quy luật hữu hạn mô tả được vô hạn nhịp
  - id: M3
    van_de: Điều gì thực sự quyết định sự tồn tại của giới hạn gần 0?
    chung_cu: soi chiếu với x\sin(1/x)
    ket_luan: dao động vô hạn có thể tồn tại cùng một giới hạn nếu biên độ co về 0
    giai_nghia: tách vai trò mật độ dao động và biên độ
  mang_phu_thuoc:
    mach_can_truoc: []
    menh_de_can_truoc: []
    bieu_dien_phu_thuoc: []
    vong_tron_va_cach_pha: []
  trat_tu_nhan_thuc:
    thu_tu:
    - M1
    - M2
    - đồ thị toàn cảnh
    - M3
    - bài tập
    li_do: Từ cơ chế hợp hàm đến các mốc dao động, rồi đọc toàn cảnh và chuyển giao sang cơ chế biên độ.
    diem_hinh_thanh_du_doan: M1
    diem_sua_truc_giac: M3
    diem_ket_tinh: đồ thị toàn cảnh và phép soi chiếu
  muc_hien_thi:
  - mạch công thức và miền
  - nghiệm/cực trị/biến thiên
  - đồ thị toàn cảnh
  - soi chiếu x sin(1/x)
  - hệ bài tập
  kien_truc:
    khoi_mo: hai nhịp điệu trong một công thức
    nhan_dien: miền, tập giá trị, tính lẻ, không tuần hoàn
    trien_khai: hai hành vi của phép nghịch đảo và các dãy mốc
    ket_tinh: toàn cảnh đồ thị
    soi_chieu: x\sin(1/x)
    khep_lai: vai trò riêng của đầu vào và biên độ
  dieu_kien_dung_rieng: []
