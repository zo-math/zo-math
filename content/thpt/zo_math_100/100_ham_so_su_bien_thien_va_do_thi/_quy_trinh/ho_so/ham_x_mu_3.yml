he_thong_bai_tap:
  kich_hoat: true
  li_do_khong_kich_hoat: null
  trang_thai_thiet_ke: dat
  muc_tieu:
  - tai_dung_mach_cot_loi
  - phat_trien_tu_mach_cot_loi
  nhom_bai:
  - ten: Tính lẻ, đồng biến và điểm uốn tại gốc tọa độ
    bai_so:
    - 1
    - 2
    muc_tieu: Tái dựng tính lẻ, chứng minh đồng biến trực tiếp, cơ chế nghiệm bội của y', điểm uốn, tập giá trị và hàm ngược.
  - ten: Từ $y=x^3$ đến các hàm bậc ba khác
    bai_so:
    - 3
    - 4
    muc_tieu: Phát triển cơ chế điểm uốn/không cực trị qua phép tịnh tiến và đối chiếu với trường hợp y' thực sự đổi dấu tạo
      cực trị.
  co_goi_y: false
  co_dap_an: false
  co_loi_giai: false
  hop_dong:
    mach_cot_loi:
    - id: MX01
      noi_dung: D=R; hàm lẻ, đối xứng qua gốc và x^3 cùng dấu với x.
    - id: MX02
      noi_dung: Với a<b, b^3-a^3>0 nên y=x^3 đồng biến nghiêm ngặt trên R mà không cần dựa trước vào đạo hàm.
    - id: MX03
      noi_dung: Hai giới hạn tại vô cực cùng tính liên tục/đồng biến cho tập giá trị R và tính một-một.
    - id: MX04
      noi_dung: y'=3x^2 có nghiệm bội 2 tại 0 nên không đổi dấu; y'(0)=0 không tạo cực trị.
    - id: MX05
      noi_dung: Từ y'=3x^2, bất đẳng thức cho thấy độ dốc giảm dần về 0 ở phía trái và tăng dần ở phía phải; sau đó y''=6x
        xác nhận sự đổi tính cong, nên O là điểm uốn; tiếp tuyến tại O là y=0 và đường cong đi xuyên qua tiếp tuyến.
    - id: MX06
      noi_dung: Từ tính một-một và tập giá trị R suy ra f^{-1}(x)=∛x; phản xạ qua y=x biến tiếp tuyến ngang tại gốc thành
        tiếp tuyến đứng của hàm ngược.
    bai_tap:
    - so: 1
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX01
      - MX02
      - MX04
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Chứng minh hàm lẻ; chứng minh a^3<b^3 từ b^3-a^3; tính y'=3x^2, nhận diện nghiệm bội 2 tại 0 và giải
        thích vì sao y' không đổi dấu.
    - so: 2
      chuc_nang:
      - tai_dung
      tai_dung_mat_xich:
      - MX03
      - MX05
      - MX06
      phat_trien_tu_mat_xich: []
      ket_qua_mong_doi: Từ y'=3x^2 dùng bất đẳng thức để tái dựng chuyển động của độ dốc, rồi dùng y''=6x kiểm tra và xác lập
        O là điểm uốn với tiếp tuyến y=0; chứng minh tập giá trị R, tìm f^{-1}(x)=∛x; dùng đối xứng qua y=x để giải thích
        tiếp tuyến ngang của y=x^3 tương ứng với tiếp tuyến đứng của hàm ngược, điểm uốn tại O được giữ qua phản xạ và
        không có cực trị nào cần phản chiếu.
    - so: 3
      chuc_nang:
      - phat_trien
      tai_dung_mat_xich: []
      phat_trien_tu_mat_xich:
      - MX02
      - MX04
      - MX05
      ket_qua_mong_doi: x^3-3x^2+3x=(x-1)^3+1 là bản tịnh tiến của x^3; đạo hàm không đổi dấu nên không có cực trị; điểm uốn
        dời tới (1,1) và tiếp tuyến được xác định tại đó.
    - so: 4
      chuc_nang:
      - phat_trien
      tai_dung_mat_xich: []
      phat_trien_tu_mat_xich:
      - MX04
      ket_qua_mong_doi: y'=3x^2-3=0 tại x=±1; xét dấu cho thấy y' đổi dấu qua từng nghiệm nên xuất hiện cực trị; y'(a)=0 riêng
        lẻ chưa đủ để kết luận cực trị.
    xac_nhan_agent:
      tai_dung: dat
      phat_trien: dat
      dong_bo: dat
    dong_bo:
      noi_dung_hoc_thuat_sha256: 374dcc3428991eb212a59e0e0d2fbeed33fbfaf31c543b982fe39daf76c839a9
      noi_dung_bai_tap_sha256: 9b4f6954f57e5226dc8e749ed701d649f8ed6c703074889d181c3d4270bc06b1
he_khoi_noi_dung:
  co_su_dung: true
  li_do_khong_su_dung: null
  cac_khoi:
  - tieu_de: Hàm số lẻ
    trang_thai: thu_gon
    mau: do
    li_do: Khái niệm lí thuyết chung, có thể tái sử dụng ngoài riêng y=x^3; người học đã biết có thể bỏ qua, nên dùng khối đỏ thu gọn.
    vi_tri: Mục Nhận diện và tính đối xứng, trước khi áp dụng cho f(x)=x^3.
  - tieu_de: Nghiệm bội và sự đổi dấu
    trang_thai: thu_gon
    mau: do
    li_do: Cơ chế tổng quát về nghiệm bội và sự đổi dấu, không phải kiến thức riêng của y=x^3; nội dung dùng để tra cứu/bổ trợ nên dùng khối đỏ thu gọn.
    vi_tri: Mục Đồng biến nghiêm ngặt dù đạo hàm bằng 0 tại gốc, trước khi áp dụng cho y'=3x^2.
  - tieu_de: Điểm uốn của đồ thị
    trang_thai: thu_gon
    mau: do
    li_do: Khái niệm/tiêu chuẩn điểm uốn là lí thuyết chung và có thể vượt phần kiến thức bắt buộc của một số người học; dùng khối đỏ thu gọn để tra cứu khi cần.
    vi_tri: Mục Độ dốc thay đổi và điểm uốn, ngay sau khi tính y''=6x.
  lop_cu_phat_hien: []
  quyet_dinh_chuyen_doi: Bảng biến thiên R1 đã được đưa ra khỏi zo-block và trình bày bằng bảng Markdown thường; R4 giữ
    ba khối đỏ thu gọn cho kiến thức có tính khái quát, còn các kết luận riêng của y=x^3 nằm công khai trong mạch chính.
tu_kiem_noi_dung:
  toan_hoc:
    trang_thai: dat
    tieu_chi:
    - id: TH01
      noi_dung: dung_doi_tuong_va_tap_xac_dinh
      trang_thai: dat
      can_cu:
      - Mục 'Nhận diện và tính đối xứng' xác định D=R trực tiếp từ công thức đại số y=x^3, không có điều kiện xác định nào
        bị bỏ sót.
      hanh_dong_sua: null
    - id: TH02
      noi_dung: nhat_quan_cong_thuc_mien_ki_hieu_thuat_ngu_tham_so_va_quy_uoc
      trang_thai: dat
      can_cu:
      - Kí hiệu y^\prime, y^{\prime\prime} dùng nhất quán xuyên toàn bài, kể cả trong mục Soi chiếu với y=x^2 và trong phần
        Bài tập.
      hanh_dong_sua: null
    - id: TH03
      noi_dung: dung_dieu_kien_va_pham_vi_cua_tung_menh_de
      trang_thai: dat
      can_cu:
      - 'Mọi mệnh đề đều gắn đúng miền: đồng biến trên R, y^\prime>=0 với mọi x, hai giới hạn tại +-infty, tập giá trị = R.'
      hanh_dong_sua: null
    - id: TH04
      noi_dung: xu_li_truong_hop_bien_suy_bien_va_ngoai_le
      trang_thai: dat
      can_cu:
      - D=R không có đầu mút hữu hạn hay điểm loại trừ; trường hợp biên duy nhất là hai phía vô cực, đã xử lý bằng hai giới
        hạn tường minh trong mục Sự biến thiên.
      hanh_dong_sua: null
    - id: TH05
      noi_dung: phan_biet_ton_tai_duy_nhat_va_tinh_day_du
      trang_thai: dat
      can_cu:
      - Đoạn 'Vì y=x^3 liên tục và đồng biến nghiêm ngặt...' chứng minh cả tồn tại (hai giới hạn trải khắp R) lẫn duy nhất
        (đồng biến nghiêm ngặt) cho mỗi nghiệm x^3=m.
      hanh_dong_sua: null
    - id: TH06
      noi_dung: khong_ket_luan_vuot_qua_chung_cu
      trang_thai: dat
      can_cu:
      - Bài chỉ dùng từ 'đồng biến' (không dùng 'cực trị' sai cho x=0); kết luận điểm uốn dựa đúng trên dấu y^{\prime\prime}
        đã tính, không suy rộng quá phạm vi đã chứng minh.
      hanh_dong_sua: null
    - id: TH07
      noi_dung: ket_qua_so_co_muc_bao_dam_dung
      trang_thai: dat
      can_cu:
      - Bài chỉ dùng kết quả biểu tượng (đạo hàm, giới hạn, nghiệm đại số); không có phép tính số gần đúng nào nên không có
        mức bảo đảm nào bị bỏ sót; tiêu chí được thỏa mãn vacuously vì không có vi phạm thể xảy ra.
      hanh_dong_sua: null
    - id: TH08
      noi_dung: cong_thuc_bang_hinh_va_van_xuoi_khong_mau_thuan
      trang_thai: dat
      can_cu:
      - Bảng biến thiên R4 đặt dấu + ở hai cột khoảng (-∞,0) và (0,+∞), đặt 0 tại x=0; hàng y dùng hai mũi tên tăng từ -∞
        qua 0 đến +∞, khớp y'=3x^2 và văn xuôi.
      hanh_dong_sua: null
    - id: TH09
      noi_dung: khong_co_vong_tron_chung_cu
      trang_thai: dat
      can_cu:
      - Kết luận x=0 không phải cực trị dựa trên y'=3(x-0)^2>0 ở hai phía; kết luận điểm uốn tách riêng và dựa trên y''=6x
        đổi dấu.
      hanh_dong_sua: null
    - id: TH10
      noi_dung: phan_biet_tinh_chat_va_dai_luong_trong_thuat_ngu
      trang_thai: dat
      can_cu:
      - Bài gọi đúng 'bề lõm hướng lên/xuống' là tính chất hình học; không dùng 'độ lõm' như một đại lượng chưa định nghĩa;
        hệ số góc tiếp tuyến tại gốc được cho bằng đại lượng rõ ràng y^\prime(0)=0.
      hanh_dong_sua: null
    - id: TH11
      noi_dung: bang_dao_ham_xu_li_dau_mut_theo_mien_dao_ham
      trang_thai: dat
      can_cu:
      - Miền của y' và y'' đều là R, trùng miền của y; bảng biến thiên chỉ dùng -infty,+infty như kí hiệu giới hạn chuẩn,
        không có đầu mút hữu hạn nào thuộc miền của y nhưng bị loại khỏi miền đạo hàm; không có trường hợp cần xử lý.
      hanh_dong_sua: null
    - id: TH12
      noi_dung: phan_biet_diem_doan_do_dai_va_dai_luong_vo_huong
      trang_thai: dat
      can_cu:
      - Bài chỉ nói đến điểm O(0,0) và các điểm (1,1), (-1,-1) trên hình; không có lập luận về đoạn hay độ dài có thể gây
        nhập nhằng với đại lượng vô hướng.
      hanh_dong_sua: null
  mach_giai_thich:
    trang_thai: dat
    tieu_chi:
    - id: MG01
      noi_dung: cau_hoi_dan_duong_dieu_khien_viec_chon_noi_dung
      trang_thai: dat
      can_cu:
      - 'Câu hỏi dẫn đường được trả lời theo chuỗi: chứng minh đồng biến bằng đại số; giải thích y''(0)=0 bằng nghiệm bội;
        dùng y'''' để xác lập điểm uốn; kết tinh bằng bảng/đồ thị và mục Nhìn lại.'
      hanh_dong_sua: null
    - id: MG02
      noi_dung: ban_do_hien_tuong_du_nam_thanh_phan
      trang_thai: dat
      can_cu:
      - ban_do_hien_tuong trong hồ sơ có đủ năm cột hiện tượng/cơ chế/dấu hiệu/chứng cứ/biểu diễn cho cả hai hiện tượng trung
        tâm.
      hanh_dong_sua: null
    - id: MG03
      noi_dung: moi_mach_du_sau_chuc_nang
      trang_thai: dat
      can_cu:
      - 'Sáu mạch trong de_cuong_van_hanh lần lượt hiện thành các cụm H2: nhận diện; đồng biến; điểm uốn; bảng/đồ thị + soi
        chiếu; hàm ngược; nhìn lại.'
      hanh_dong_sua: null
    - id: MG04
      noi_dung: quan_he_phu_thuoc_duoc_ton_trong
      trang_thai: dat
      can_cu:
      - 'QMD đi đúng phụ thuộc: Nhận diện -> Đồng biến -> Độ dốc/điểm uốn -> Bảng/đồ thị -> Soi chiếu y=x^2 -> Hàm ngược ->
        Nhìn lại -> Bài tập.'
      hanh_dong_sua: null
    - id: MG05
      noi_dung: trat_tu_nhan_thuc_hop_li
      trang_thai: dat
      can_cu:
      - Bài đặt chứng minh đại số cho thuộc tính đồng biến trước khi dùng đạo hàm để giải thích độ dốc; khái niệm điểm uốn
        chỉ xuất hiện sau y'', rồi mới mở sang soi chiếu và hàm ngược.
      hanh_dong_sua: null
    - id: MG06
      noi_dung: moi_phan_co_chuc_nang
      trang_thai: dat
      can_cu:
      - 'Mỗi H2 có chức năng riêng: nhận diện đối xứng; chứng minh đồng biến; đọc độ cong; tổng hợp bằng bảng/đồ thị; soi
        chiếu x^2; chuyển sang hàm ngược; khép lại bằng phân biệt ba tiêu chí.'
      hanh_dong_sua: null
    - id: MG07
      noi_dung: bang_va_hinh_tong_hop_ket_qua_da_xac_lap
      trang_thai: dat
      can_cu:
      - 'Bảng biến thiên và đồ thị chỉ nén các kết quả đã chứng minh: dấu y'', chiều tăng, điểm O, đối xứng và hình dạng;
        không dùng hình/bảng để thay chứng minh.'
      hanh_dong_sua: null
    - id: MG08
      noi_dung: co_phan_doc_nguoc_sau_bieu_dien
      trang_thai: dat
      can_cu:
      - Ngay sau đồ thị, mục 'Vì sao y=x^2 quay đầu còn y=x^3 đi qua gốc?' đọc ngược hình về bội nghiệm y'=0, dấu y' và quan
        hệ với tiếp tuyến.
      hanh_dong_sua: null
    - id: MG09
      noi_dung: ket_luan_tra_loi_cau_hoi_mo_dau
      trang_thai: dat
      can_cu:
      - Mục 'Nhìn lại điểm dừng tại gốc' trả lời trực tiếp nghịch lí mở đầu bằng cách tách vai trò của y'(0)=0, dấu y' và
        dấu y''.
      hanh_dong_sua: null
    - id: MG10
      noi_dung: ham_phu_va_ten_phu_chi_dung_khi_giam_tai_nhan_thuc
      trang_thai: dat
      can_cu:
      - Không tạo hàm phụ để né lập luận; kí hiệu f chỉ được dùng khi cần phát biểu hàm lẻ và khi viết ánh xạ/hàm ngược, đúng
        lúc nó giảm nhập nhằng.
      hanh_dong_sua: null
    - id: MG11
      noi_dung: nhan_manh_theo_chuc_nang_khong_thay_cau_truc_lap_luan
      trang_thai: dat
      can_cu:
      - R4 dùng đúng ba khối đỏ thu gọn cho ba kiến thức khái quát (hàm lẻ, nghiệm bội, điểm uốn); các kết luận riêng của
        y=x^3 vẫn nằm công khai trong mạch chính, còn bảng biến thiên là Markdown thường.
      hanh_dong_sua: null
    - id: MG12
      noi_dung: uu_tien_ngon_ngu_ham_so_tu_nhien_truoc_ngon_ngu_anh_xa_khi_khong_can_thiet
      trang_thai: dat
      can_cu:
      - Phần chính dùng ngôn ngữ hàm số tự nhiên; kí hiệu ánh xạ f:R->R chỉ xuất hiện ở mục hàm ngược, nơi miền/đích và tính
        song ánh thực sự cần được nêu.
      hanh_dong_sua: null
    - id: MG13
      noi_dung: ki_hieu_tuong_duong_khong_thay_the_lap_luan_giai_thich_va_dieu_kien
      trang_thai: dat
      can_cu:
      - Bài không dùng chuỗi \Leftrightarrow; suy luận về tập giá trị và điểm uốn đều được viết bằng lời kèm điều kiện áp
        dụng.
      hanh_dong_sua: null
    - id: MG14
      noi_dung: heading_khep_lai_tu_nhien_khong_dung_ket_tinh_lam_nhan_mac_dinh
      trang_thai: dat
      can_cu:
      - Mục khép lại mang heading nội dung cụ thể 'Nhìn lại điểm dừng tại gốc', không dùng nhãn vận hành như 'Kết tinh'.
      hanh_dong_sua: null
  gia_tri_nhan_thuc:
    trang_thai: dat
    tieu_chi:
    - id: NT01
      noi_dung: hien_tuong_trung_tam_du_dac_trung
      trang_thai: dat
      can_cu:
      - Hiện tượng trung tâm là đồng biến nghiêm ngặt dù y'(0)=0, đồng thời đổi tính cong tại gốc; đây là đặc trưng đủ cụ
        thể để điều khiển việc chọn nội dung.
      hanh_dong_sua: null
    - id: NT02
      noi_dung: bai_lam_ro_co_che_khong_chi_liet_ke
      trang_thai: dat
      can_cu:
      - 'R4 không chỉ liệt kê tính chất: chứng minh b^3-a^3>0 để tách tính đồng biến khỏi việc định nghĩa bằng đạo hàm;
        giải thích bội chẵn của nghiệm y^\prime; theo dõi trực tiếp độ dốc từ y^\prime=3x^2 rồi dùng y^{\prime\prime}=6x để nhận diện nhanh sự đổi tính cong.'
      hanh_dong_sua: null
    - id: NT03
      noi_dung: khai_niem_moi_xuat_hien_dung_luc
      trang_thai: dat
      can_cu:
      - Khái niệm nghiệm bội được giới thiệu ngay trước khi dùng cho y'=3x^2; khái niệm điểm uốn được giới thiệu sau khi y''=6x
        đã xuất hiện.
      hanh_dong_sua: null
    - id: NT04
      noi_dung: chi_tiet_ki_thuat_khong_che_mach_chinh
      trang_thai: dat
      can_cu:
      - Các bước đại số (đạo hàm, giới hạn) đều ngắn gọn; mạch chính vẫn là hiện tượng đồng biến cộng điểm uốn, không bị chi
        tiết kĩ thuật lấn át.
      hanh_dong_sua: null
    - id: NT05
      noi_dung: phan_mo_rong_khong_cat_mach_chinh
      trang_thai: dat
      can_cu:
      - Các hướng phát triển (soi chiếu với y=x^2 và hàm ngược) chỉ xuất hiện sau khi mạch cốt lõi về đồng biến, nghiệm bội,
        điểm uốn và đồ thị đã hoàn tất.
      hanh_dong_sua: null
    - id: NT06
      noi_dung: phep_soi_chieu_co_gia_tri
      trang_thai: dat
      can_cu:
      - 'Bảng soi chiếu y=x^2/y=x^3 làm lộ hai vai trò khác nhau của số bội: bội của nghiệm y'' chi phối đổi dấu/cực trị,
        bội của f-T mô tả việc đường cong ở một phía hay đi qua tiếp tuyến.'
      hanh_dong_sua: null
    - id: NT07
      noi_dung: diem_ket_tinh_lam_hien_quan_he
      trang_thai: dat
      can_cu:
      - Bảng biến thiên và đồ thị tổng hợp cho thấy đồng biến qua cả gốc; mục soi chiếu ngay sau đó làm hiện quan hệ giữa
        dấu y', số bội, cực trị và cách đường cong gặp tiếp tuyến.
      hanh_dong_sua: null
    - id: NT08
      noi_dung: bai_de_lai_cach_nhin_co_the_chuyen_giao
      trang_thai: dat
      can_cu:
      - 'Mục Nhìn lại nêu quy tắc chuyển giao: y''(a)=0 chỉ tạo điểm cần khảo sát; Bài 3-4 áp dụng lại cách nhìn về số bội,
        dấu đạo hàm, điểm uốn và cực trị cho các hàm bậc ba khác.'
      hanh_dong_sua: null
    - id: NT09
      noi_dung: cach_nhin_moi_van_yeu_cau_kiem_tra_dieu_kien
      trang_thai: dat
      can_cu:
      - Bài tập 4 câu b yêu cầu xét dấu y^\prime hai bên nghiệm trước khi kết luận cực trị, không áp dụng tiêu chí máy móc.
      hanh_dong_sua: null
    - id: NT10
      noi_dung: ket_tinh_nen_cach_nhin_khong_chi_tom_tat
      trang_thai: dat
      can_cu:
      - 'Phần Nhìn lại nén bài thành ba câu hỏi vận hành riêng: tiếp tuyến nằm ngang hay không, biến thiên có đổi chiều hay
        không, tính cong có đổi hay không.'
      hanh_dong_sua: null
    - id: NT11
      noi_dung: bai_co_chieu_sau_va_huong_phat_trien_tu_nhien_phu_hop_voi_doi_tuong
      trang_thai: dat
      can_cu:
      - 'Chiều sâu R4 phát triển tự nhiên từ cùng đối tượng: chứng minh đồng biến không cần đạo hàm, đọc chuyển động của độ dốc
        trước đạo hàm bậc hai, dùng số bội/độ cong, soi chiếu y=x^2, rồi phản xạ sang hàm ngược qua y=x bằng hình minh họa riêng.'
      hanh_dong_sua: null
  he_thong_bai_tap:
    ap_dung_theo_ho_so: true
    li_do_khong_ap_dung: null
    trang_thai: dat
    tieu_chi:
    - id: BT01
      noi_dung: gia_thiet_va_du_lieu_day_du_nhat_quan
      trang_thai: dat
      can_cu:
      - Bốn bài đều cho hàm số tường minh; Bài 1-2 dùng y=x^3, Bài 3 dùng y=x^3-3x^2+3x, Bài 4 dùng y=x^3-3x; không thiếu
        dữ liệu cần thiết.
      hanh_dong_sua: null
    - id: BT02
      noi_dung: yeu_cau_xac_dinh_va_giai_duoc
      trang_thai: dat
      can_cu:
      - 'Mỗi câu a/b/c có yêu cầu xác định; công cụ cần thiết đều đã có trong thân bài: phân tích hiệu hai lập phương, bất
        đẳng thức đọc sự thay đổi độ dốc, đạo hàm, số bội, dấu y^{\prime\prime}, tập giá trị và hàm ngược.'
      hanh_dong_sua: null
    - id: BT03
      noi_dung: ket_qua_mong_doi_hoac_loi_giai_tham_chieu_dung
      trang_thai: dat
      can_cu:
      - 'hop_dong.bai_tap[].ket_qua_mong_doi đã được tự kiểm bằng tính tay: x^3-3x^2+3x=(x-1)^3+1 (khai triển đúng); y^\prime=3x^2-3=0
        tại x=+-1, đổi dấu quanh mỗi nghiệm nên là cực trị thực.'
      hanh_dong_sua: null
    - id: BT04
      noi_dung: thu_tu_ton_trong_quan_he_phu_thuoc
      trang_thai: dat
      can_cu:
      - Nhóm tái dựng Bài 1-2 phủ toàn bộ sáu mắt xích cốt lõi trước; nhóm phát triển Bài 3-4 mới chuyển cơ chế sang các hàm
        bậc ba khác.
      hanh_dong_sua: null
    - id: BT05
      noi_dung: he_bai_tap_tiep_tuc_muc_tieu_nhan_thuc
      trang_thai: dat
      can_cu:
      - Bài 1-2 tái dựng đúng mạch cốt lõi, trong đó Bài 2a buộc người học dùng bất đẳng thức để tái dựng sự thay đổi độ dốc
        trước khi kiểm tra lại bằng đạo hàm bậc hai; Bài 3-4 mới phát triển sang các hàm bậc ba khác.
      hanh_dong_sua: null
    - id: BT06
      noi_dung: phan_vuot_pham_vi_duoc_goi_dung_la_mo_rong
      trang_thai: dat
      can_cu:
      - Các bài phát triển vẫn nằm trong phạm vi hàm bậc ba, đạo hàm, cực trị và điểm uốn của dự án; tiêu đề công khai không
        dùng nhãn nội bộ 'tái dựng/phát triển'.
      hanh_dong_sua: null
  he_khoi_noi_dung:
    kich_hoat: true
    trang_thai: dat
    tieu_chi:
    - id: KH01
      noi_dung: moi_khoi_thuc_su_can_thiet
      trang_thai: dat
      can_cu:
      - 'R4 chỉ dùng ba khối đỏ thu gọn cho ba kiến thức có khả năng tái sử dụng: định nghĩa hàm lẻ, cơ chế nghiệm bội và sự đổi dấu,
        khái niệm/tiêu chuẩn điểm uốn; bảng biến thiên không còn bị bọc khối.'
      hanh_dong_sua: null
    - id: KH02
      noi_dung: trang_thai_hien_thi_phu_hop_voi_mach_chinh
      trang_thai: dat
      can_cu:
      - Cả ba khối đều thu gọn trên HTML vì chúng là khái niệm chung dùng để tra cứu/bổ trợ, không phải kiến thức riêng bắt
        buộc của y=x^3. Kết luận cần cho mạch chính được phát biểu và chứng minh công khai ngoài khối.
      hanh_dong_sua: null
    - id: KH03
      noi_dung: mau_theo_dung_chuc_nang_noi_dung
      trang_thai: dat
      can_cu:
      - Ba khối dùng zo-block-red vì đều mang nội dung lí thuyết/khái quát có thể dùng ngoài riêng y=x^3; không dùng màu xám
        cho bảng biến thiên nữa.
      hanh_dong_sua: null
    - id: KH04
      noi_dung: tieu_de_goi_dung_noi_dung_hoac_vai_tro
      trang_thai: dat
      can_cu:
      - Các tiêu đề 'Hàm số lẻ', 'Nghiệm bội và sự đổi dấu', 'Điểm uốn của đồ thị' gọi trực tiếp đúng nội dung của từng khối.
      hanh_dong_sua: null
    - id: KH05
      noi_dung: cu_phap_lop_hien_hanh_va_day_du
      trang_thai: dat
      can_cu:
      - 'Cả ba khối dùng cú pháp thu gọn hiện hành <details class="zo-block zo-block-red"> cùng <summary class="zo-block-title">;
        checker function-block-structure đã PASS.'
      hanh_dong_sua: null
    - id: KH06
      noi_dung: khong_thu_gon_mat_xich_bat_buoc
      trang_thai: dat
      can_cu:
      - 'Không có mắt xích bắt buộc nào bị giấu: sau mỗi khối thu gọn, thân bài công khai trực tiếp áp dụng vào y=x^3 và
        chứng minh các kết luận riêng cần cho mạch lập luận.'
      hanh_dong_sua: null
    - id: KH07
      noi_dung: lop_cu_duoc_nhan_dien_va_xu_li_dung_pham_vi
      trang_thai: dat
      can_cu:
      - Checker function-legacy-classes báo PASS; R4 không có lớp collapsible-box-*/highlight-box-* cũ.
      hanh_dong_sua: null
    - id: KH08
      noi_dung: khong_dung_khoi_chi_de_tao_nhan_manh_thi_giac
      trang_thai: dat
      can_cu:
      - Không có khối nào chỉ bọc một câu để tạo màu; mỗi khối chứa định nghĩa/cơ chế tổng quát và được áp dụng ngay sau khối.
      hanh_dong_sua: null
