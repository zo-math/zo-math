menh_de_chung_cu:
- phat_bieu: Hàm số đồng biến trên toàn $\mathbb{R}$
  trang_thai: dat
  chung_cu: $x_1 < x_2 \Rightarrow x_1^3 < x_2^3$, hoặc đạo hàm $y'=3x^2 \ge 0$ và chỉ bằng 0 tại 1 điểm hữu hạn
  dieu_kien: Mọi $x \in \mathbb{R}$
- phat_bieu: Đồ thị đối xứng qua gốc $(0,0)$
  trang_thai: dat
  chung_cu: f(-x) = (-x)^3 = -x^3 = -f(x), hàm số lẻ
  dieu_kien: Mọi $x \in \mathbb{R}$
- phat_bieu: Gốc tọa độ là điểm uốn, đồ thị phẳng ra tại đó
  trang_thai: dat
  chung_cu: $y''(x) = 6x$ đổi dấu qua gốc, $y'(0)=0$
  dieu_kien: $x=0$
- phat_bieu: Tiếp tuyến tại điểm uốn xuyên qua đồ thị
  trang_thai: dat
  chung_cu: $x^3 - 0 = x^3$, đổi dấu khi đi qua $0$
  dieu_kien: $x=0$
kiem_tra_quan_he_trung_tam:
- phat_bieu: Tính đồng biến nghiêm ngặt của y=x^3
  phep_thu: $a<b \Rightarrow b^3-a^3=(b-a)(a^2+ab+b^2)>0$
  ket_luan: Đúng với mọi $a,b\in\mathbb{R}$ thỏa $a<b$; đạo hàm $3x^2$ sau đó giải thích cơ chế độ dốc.
  trang_thai: dat
- phat_bieu: Tập giá trị là toàn bộ R (toàn ánh)
  phep_thu: Với mọi m thực, xét g(x)=x^3-m; g liên tục, dong bien nghiem ngat (g'=3x^2>=0, chi bang 0 tai 1 diem), g(-infty)=-infty,
    g(+infty)=+infty nen ton tai va duy nhat nghiem
  ket_luan: Voi moi so thuc m, phuong trinh x^3=m co dung mot nghiem thuc; tap gia tri = R
  trang_thai: dat
- phat_bieu: x=0 la diem toi han nhung khong phai cuc tri (diem uon)
  phep_thu: y'=3x^2>=0 voi moi x, chi bang 0 tai x=0 (khong doi dau); y''=6x doi dau tai x=0
  ket_luan: Dao ham bac nhat khong doi dau nen khong co cuc tri; dao ham bac hai doi dau nen (0,0) la diem uon
  trang_thai: dat
truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu: Hàm số đồng biến nghiêm ngặt trên toàn miền dù y'(0)=0; tại gốc, đạo hàm không đổi dấu nhưng độ cong đổi dấu,
      nên xuất hiện điểm uốn có tiếp tuyến nằm ngang thay vì cực trị.
    pham_vi: Toàn bộ $\mathbb{R}$, với trọng tâm địa phương tại $x=0$.
    vi_sao_dang_khao_sat: 'Đây là nguyên mẫu giúp tách ba câu hỏi thường bị nhập làm một: hàm có đồng biến không, điểm dừng
      có là cực trị không, và đồ thị có đổi tính cong không.'
    trang_thai: dat
  cau_hoi_dan_duong: Vì sao $y=x^3$ đồng biến nghiêm ngặt trên $\mathbb{R}$ dù $y^\prime(0)=0$, và vì sao gốc tọa độ là điểm
    uốn có tiếp tuyến nằm ngang chứ không phải cực trị?
  cau_tra_loi_da_kiem_tra: Đại số cho $b^3-a^3>0$ khi $a<b$, nên tính đồng biến nghiêm ngặt không phụ thuộc vào việc đạo hàm
    có triệt tiêu tại một điểm. $y^\prime=3x^2$ có nghiệm bội chẵn tại 0 nên không đổi dấu, còn $y^{\prime\prime}=6x$ đổi
    dấu qua 0; vì vậy đồ thị tiếp tục tăng nhưng đổi tính cong tại gốc.
  nhan_thuc_co_the_chuyen_giao: 'Điều kiện $y^\prime(a)=0$ chỉ đánh dấu một điểm cần khảo sát tiếp: cực trị phụ thuộc vào
    sự đổi chiều biến thiên, còn điểm uốn phụ thuộc vào sự đổi tính cong.'
  chuoi_nen:
    hien_tuong: Đồng biến nghiêm ngặt nhưng có một điểm có tiếp tuyến nằm ngang.
    co_che: Bội chẵn của nghiệm y'=0 làm đạo hàm không đổi dấu; đồng thời y'' đổi dấu qua gốc.
    chung_cu: $b^3-a^3>0$ khi $a<b$; $y^\prime=3x^2$; $y^{\prime\prime}=6x$.
    hinh_dang: Đường cong hình chữ S đi xuyên qua tiếp tuyến ngang tại gốc.
    nhan_thuc: Phải phân biệt tính đồng biến, cực trị và tính cong; số bội giúp nhận ra cơ chế đổi dấu nhưng không thay thế
      việc kiểm tra điều kiện kết luận.
ban_do_hien_tuong:
- hien_tuong: Đồ thị có hình chữ S đối xứng.
  co_che: Hàm số lẻ nên đồ thị đối xứng tâm qua O; y'' đổi dấu qua 0.
  dau_hieu: Hai nhánh ở góc phần tư I và III, cùng đi qua O và đổi tính cong tại O.
  chung_cu: $f(-x)=-f(x)$ và $y^{\prime\prime}=6x$ đổi dấu qua $0$.
  bieu_dien: Đồ thị toàn cục và khối Hàm số lẻ/Điểm uốn.
- hien_tuong: Đồ thị phẳng ra tại gốc nhưng không quay đầu.
  co_che: y'=3x^2 có nghiệm bội 2 tại 0 nên giữ dấu dương ở hai phía.
  dau_hieu: $y^\prime(0)=0$ nhưng $y^\prime>0$ với $x\ne0$.
  chung_cu: $y^\prime=3(x-0)^2$.
  bieu_dien: Bảng biến thiên, đồ thị và bảng soi chiếu với y=x^2.
- hien_tuong: Tiếp tuyến ngang của y=x^3 tương ứng với tiếp tuyến đứng của hàm ngược tại gốc.
  co_che: Phản xạ đồ thị của hai hàm ngược qua đường thẳng y=x.
  dau_hieu: $f^{-1}(x)=\sqrt[3]{x}$ và hai đồ thị đối xứng qua $y=x$.
  chung_cu: f là một-một và phủ hết R nhờ đồng biến nghiêm ngặt và tập giá trị R.
  bieu_dien: Mục Từ tính đồng biến đến hàm ngược.
