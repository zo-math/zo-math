    tom_tat: Chứng minh đồng biến nghiêm ngặt bằng hiệu hai lập phương; nối với giới hạn, tập giá trị, đạo hàm và nghiệm bội.
  - id: diem_uon
    tom_tat: Dùng y'' để đọc sự thay đổi độ dốc, xác lập điểm uốn và quan hệ với tiếp tuyến ngang.
  - id: bang_do_thi_soi_chieu
    tom_tat: Nén kết quả bằng bảng biến thiên và đồ thị, rồi soi chiếu với y=x^2 qua số bội và dấu đạo hàm.
  - id: ham_nguoc
    tom_tat: Từ đồng biến và tập giá trị R suy ra hàm ngược, đọc phép đối xứng qua y=x.
  - id: nhin_lai
    tom_tat: Phân biệt rõ điều kiện điểm dừng, cực trị và điểm uốn; nêu giới hạn của việc dùng số bội như một dấu hiệu.
  mang_phu_thuoc:
    mach_can_truoc:
    - nhan_dien_tong_quan -> dong_bien_dai_so_vi_phan -> diem_uon -> bang_do_thi_soi_chieu -> ham_nguoc -> nhin_lai
    menh_de_can_truoc: []
    bieu_dien_phu_thuoc: []
    vong_tron_va_cach_pha: []
  trat_tu_nhan_thuc:
    thu_tu:
    - nhan_dien_tong_quan
    - dong_bien_dai_so_vi_phan
    - diem_uon
    - bang_do_thi_soi_chieu
    - ham_nguoc
    - nhin_lai
    li_do: Đi từ cấu trúc đại số và tính chất toàn cục đến cơ chế vi phân tại gốc, sau đó mới tổng hợp bằng hình/bảng, soi
      chiếu và chuyển sang hàm ngược.
    diem_hinh_thanh_du_doan: Tính lẻ và chứng minh đại số cho tính đồng biến nghiêm ngặt.
    diem_sua_truc_giac: Đạo hàm bằng 0 không đồng nghĩa với cực trị; tiếp tuyến ngang cũng có thể đi xuyên qua đồ thị.
    diem_ket_tinh: Ba thông tin y'(0)=0, dấu của y' và dấu của y'' được tách vai trò rõ ràng.
  muc_hien_thi: []
  kien_truc:
    khoi_mo: 'Đặt nghịch lí nhận thức: tốc độ tức thời bằng 0 tại gốc nhưng hàm vẫn đồng biến.'
    nhan_dien: Miền xác định, hàm lẻ, đối xứng, nghiệm và dấu.
    trien_khai: Đồng biến bằng đại số; giới hạn, tập giá trị; đạo hàm, nghiệm bội và điểm uốn.
    ket_tinh: Bảng biến thiên và đồ thị chữ S.
    soi_chieu: So sánh y=x^2 với y=x^3, rồi nối sang hàm ngược.
    khep_lai: 'Nhìn lại ba tiêu chí: điểm dừng, cực trị và điểm uốn.'
  dieu_kien_dung_rieng: []
ho_so_bieu_dien: []
