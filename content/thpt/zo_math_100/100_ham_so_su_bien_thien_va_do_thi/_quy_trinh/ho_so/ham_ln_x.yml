ban_do_mien:
  tap_xac_dinh: $(0,+\infty)$
  cac_thanh_phan_lien_thong:
    - $(0,+\infty)$
  dau_mut_va_diem_bien:
    - $0$ là biên trái không thuộc miền
    - $+\infty$ là hướng không bị chặn
  diem_bi_loai:
    - $0$
  diem_co_lap: []
  diem_tu: []
  cach_tiep_can_hop_le:
    - $x\to0^+$
    - $x\to+\infty$
  truong_hop_tham_so: []
vong_ra:
  nen_tang:
    - phuong_dien: doi_tuong
      trang_thai: dat
      ket_qua_chinh: Hàm lô-ga-rit tự nhiên được dựng bởi tích phân có hướng từ 1 đến x của 1/t.
      dua_vao_bai: true
      li_do: Định nghĩa và mốc chuẩn ln 1 = 0.
    - phuong_dien: tap_xac_dinh
      trang_thai: dat
      ket_qua_chinh: Tập xác định là $(0,+\infty)$.
      dua_vao_bai: true
      li_do: Phần dựng hàm và nhận diện miền.
    - phuong_dien: tap_gia_tri_va_tap_muc
      trang_thai: dat
      ket_qua_chinh: Tập giá trị là $\mathbb{R}$; hàm là song ánh từ $(0,+\infty)$ lên $\mathbb{R}$.
      dua_vao_bai: true
      li_do: Hai giới hạn biên, tính liên tục và đồng biến.
    - phuong_dien: nghiem_dau_va_giao_truc
      trang_thai: dat
      ket_qua_chinh: Nghiệm duy nhất $x=1$; $\ln x<0$ trên $(0,1)$, $\ln x>0$ trên $(1,+\infty)$; không có giao với trục tung.
      dua_vao_bai: true
      li_do: Phần mốc chuẩn và dấu.
    - phuong_dien: hanh_vi_tai_bien_mien
      trang_thai: dat
      ket_qua_chinh: $\ln x\to-\infty$ khi $x\to0^+$ và $\ln x\to+\infty$ khi $x\to+\infty$.
      dua_vao_bai: true
      li_do: Phần giới hạn biên và tiệm cận đứng.
    - phuong_dien: lien_tuc_va_gian_doan
      trang_thai: dat
      ket_qua_chinh: Hàm liên tục trên toàn miền $(0,+\infty)$, không có điểm gián đoạn thuộc miền.
      dua_vao_bai: true
      li_do: Định nghĩa tích phân và các hệ quả giải tích.
    - phuong_dien: bien_thien
      trang_thai: dat
      ket_qua_chinh: f'(x)=1/x>0 nên hàm đồng biến nghiêm ngặt trên toàn miền.
      dua_vao_bai: true
      li_do: Phần đạo hàm và bảng biến thiên.
    - phuong_dien: diem_dac_biet
      trang_thai: dat
      ket_qua_chinh: Đồ thị đi qua (1,0) và (e,1).
      dua_vao_bai: true
      li_do: Phần số e, hàm ngược và đồ thị.
    - phuong_dien: rang_buoc_do_thi
      trang_thai: dat
      ket_qua_chinh: Đồ thị nằm bên phải trục tung, tăng, lõm xuống, có tiệm cận đứng x=0 và nằm không cao hơn y=x-1.
      dua_vao_bai: true
      li_do: Phần kết tinh đồ thị.
  kich_hoat_khi_thich_hop:
    - phuong_dien: bi_chan_va_cuc_bien
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Hàm không bị chặn trên hoặc dưới và không có cực trị.
      dua_vao_bai: true
      li_do: Được xác lập từ đồng biến nghiêm ngặt và hai giới hạn biên.
    - phuong_dien: do_cong
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: f''(x)=-1/x^2<0 nên đồ thị lõm xuống trên toàn miền.
      dua_vao_bai: true
      li_do: Được dùng để giải thích độ dốc giảm dần và bất đẳng thức tiếp tuyến.
    - phuong_dien: doi_xung
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Miền không đối xứng qua 0 nên không xét chẵn/lẻ.
      dua_vao_bai: false
      li_do: Không phải hiện tượng có ích cho bài.
    - phuong_dien: tuan_hoan
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không kích hoạt khảo sát tuần hoàn.
      dua_vao_bai: false
      li_do: Hàm đồng biến nghiêm ngặt trên toàn miền.
    - phuong_dien: hop_ham
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không dùng hợp hàm làm mạch khảo sát riêng.
      dua_vao_bai: false
      li_do: Không cần cho hiện tượng trung tâm.
    - phuong_dien: ham_nguoc
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Hàm ngược là hàm mũ tự nhiên y=e^x.
      dua_vao_bai: true
      li_do: Được xác lập từ tính song ánh.
    - phuong_dien: phep_bien_doi
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Quy luật ln(ab)=ln a+ln b và công thức đổi cơ số được triển khai.
      dua_vao_bai: true
      li_do: Đây là cơ chế trung tâm và phần mở rộng trực tiếp.
    - phuong_dien: tham_so
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Bài không khảo sát một họ hàm có tham số.
      dua_vao_bai: false
      li_do: Không có tham số điều khiển đối tượng chính.
    - phuong_dien: tiem_can_va_sai_lech
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: x=0 là tiệm cận đứng; ln x<=x-1 trên toàn miền.
      dua_vao_bai: true
      li_do: Được dùng để ràng buộc hình dạng đồ thị.
    - phuong_dien: toc_do_tang_truong
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: $\ln x=o(x^\alpha)$ khi $x\to+\infty$ với $\alpha>0$.
      dua_vao_bai: true
      li_do: Được đưa vào phần mở rộng và bài tập.
    - phuong_dien: day_diem_dac_biet
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không cần một dãy điểm đặc biệt vô hạn.
      dua_vao_bai: false
      li_do: Hàm không có cấu trúc dao động hoặc tích tụ điểm.
    - phuong_dien: dao_dong
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không có hiện tượng dao động.
      dua_vao_bai: false
      li_do: Hàm đồng biến nghiêm ngặt.
    - phuong_dien: tinh_toan_so
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: e được ghi gần đúng e≈2,71828 với mức làm tròn công bố.
      dua_vao_bai: true
      li_do: Dùng để định vị điểm (e,1).
    - phuong_dien: nhieu_cua_so
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không cần mở rộng một đồ thị qua nhiều cửa sổ.
      dua_vao_bai: false
      li_do: Hai hình có chức năng khác nhau và đều đọc được trong bề ngang nội dung.
    - phuong_dien: soi_chieu
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Soi chiếu với hàm mũ tự nhiên và với các lô-ga-rit cơ số khác.
      dua_vao_bai: true
      li_do: Làm rõ vai trò tự nhiên của cơ số e.
    - phuong_dien: ung_dung_va_mo_hinh_hoa
      kich_hoat: false
      trang_thai: khong_ap_dung
      ket_qua_chinh: Không kích hoạt một mô hình ứng dụng riêng.
      dua_vao_bai: false
      li_do: Bài tập trung vào cấu trúc toán học của hàm.
    - phuong_dien: lien_he_toan_hoc_mo_rong
      kich_hoat: true
      trang_thai: dat
      ket_qua_chinh: Liên hệ tích phân, hàm ngược, đổi cơ số và thứ bậc tăng trưởng.
      dua_vao_bai: true
      li_do: Được dùng ở phần cuối và hệ bài tập.
menh_de_chung_cu:
  - id: MD01
    noi_dung: $\ln x=\int_1^x\frac{1}{t}\,dt$ với $x>0$.
    pham_vi: $x\in(0,+\infty)$
    chung_cu: Định nghĩa bằng tích phân có hướng.
  - id: MD02
    noi_dung: $\ln(ab)=\ln a+\ln b$ với $a,b>0$.
    pham_vi: $a,b>0$
    chung_cu: Đổi biến t=au trong tích phân từ a đến ab.
  - id: MD03
    noi_dung: $(\ln x)^\prime=\frac{1}{x}$ và $(\ln x)^{\prime\prime}=-\frac{1}{x^2}$.
    pham_vi: $x>0$
    chung_cu: Định lí cơ bản của giải tích và phép vi phân.
  - id: MD04
    noi_dung: $\lim_{x\to0^+}\ln x=-\infty$ và $\lim_{x\to+\infty}\ln x=+\infty$.
    pham_vi: Hai biên của miền tự nhiên.
    chung_cu: Quy luật lô-ga-rit, tính đồng biến và các cấp số nhân.
  - id: MD05
    noi_dung: $\ln x\leq x-1$ với mọi $x>0$.
    pham_vi: $x>0$
    chung_cu: Độ lõm hoặc xét hàm sai lệch.
  - id: MD06
    noi_dung: $\ln x=o(x^\alpha)$ khi $x\to+\infty$ với $\alpha>0$.
    pham_vi: $x\to+\infty,\ \alpha>0$
    chung_cu: Mệnh đề 14.7 từ nguồn lí thuyết đầy đủ và lập luận kẹp.
truc_nhan_thuc:
  hien_tuong_trung_tam:
    phat_bieu:
      Hàm $\ln x$ biến phép nhân ở đầu vào thành phép cộng ở đầu ra; cơ chế ấy đồng thời giải thích biến thiên, độ
      cong và hình dạng đồ thị.
    pham_vi: Toàn miền $(0,+\infty)$
    vi_sao_dang_khao_sat:
      Đây là cầu nối giữa thay đổi theo tỉ lệ và độ dời cộng, đồng thời là cơ chế nền của hàm mũ, đổi
      cơ số và nhiều mô hình tăng trưởng.
    trang_thai: da_kiem_tra
  cau_hoi_dan_duong:
    Vì sao một hàm được dựng từ diện tích dưới $y=1/t$ lại biến phép nhân thành phép cộng, và quy luật ấy
    quyết định toàn bộ đồ thị $y=\ln x$ như thế nào?
  cau_tra_loi_da_kiem_tra:
    "Mật độ 1/t bù đúng cho phép co giãn: khi biến độ dài theo hệ số a, độ cao giảm theo cùng tỉ lệ
    nghịch. Diện tích tương ứng được giữ nguyên, nên phép nhân ở đầu vào trở thành phép cộng ở đầu ra. Đạo hàm 1/x và đạo
    hàm cấp hai -1/x^2 chuyển cơ chế ấy thành tính đồng biến, độ lõm và hình dạng toàn cục của đồ thị."
  nhan_thuc_co_the_chuyen_giao:
    Khi cần đo thay đổi theo tỉ lệ, hãy tìm một đại lượng cộng dưới phép nhân; hàm lô-ga-rit là
    mô hình chuẩn của phép chuyển đổi ấy.
  chuoi_nen:
    hien_tuong: Nhân đầu vào với cùng một hệ số dương tạo cùng một độ dời ở đầu ra.
    co_che: Tích phân của $1/t$ bất biến dưới phép co giãn sau đổi biến.
    chung_cu: $\ln(ab)-\ln a=\ln b$ và $(\ln x)'=1/x$.
    hinh_dang: Tăng trên toàn miền, lõm xuống, dựng đứng gần $0$ và ngày càng thoải khi $x$ lớn.
    nhan_thuc: Lô-ga-rit là thước đo cộng của thay đổi theo tỉ lệ.
ban_do_hien_tuong:
  - hien_tuong: Diện tích có dấu dưới y=1/t tạo một thước đo trên miền số dương.
    co_che: Định nghĩa tích phân từ mốc 1.
    chung_cu: $\ln x=\int_1^x\frac{1}{t}\,dt$.
    bieu_dien: Hình diện tích.
    doc_nguoc: Dấu của ln x phụ thuộc vị trí của x so với 1.
  - hien_tuong: Nhân đầu vào tạo độ dời cộng cố định ở đầu ra.
    co_che: Bất biến diện tích dưới phép co giãn.
    chung_cu: $\ln(ab)=\ln a+\ln b$.
    bieu_dien: Chuỗi cấp số nhân chuyển thành cấp số cộng.
    doc_nguoc: Khoảng cách tự nhiên của lô-ga-rit là khoảng cách theo tỉ lệ.
  - hien_tuong: Đồ thị tăng nhưng ngày càng thoải.
    co_che: $f^\prime(x)>0$ và $f^{\prime\prime}(x)<0$.
    chung_cu: $f^\prime(x)=1/x,\ f^{\prime\prime}(x)=-1/x^2$.
    bieu_dien: Bảng biến thiên và đồ thị toàn cảnh.
    doc_nguoc: Độ dốc lớn gần 0 và giảm dần khi x tăng.
  - hien_tuong: Hàm ghép mỗi số dương với đúng một số thực.
    co_che: Liên tục, đồng biến nghiêm ngặt và hai giới hạn biên.
    chung_cu: $\ln:(0,+\infty)\to\mathbb{R}$ là song ánh.
    bieu_dien: Bảng biến thiên và quan hệ hàm ngược.
    doc_nguoc: Hàm mũ tự nhiên xuất hiện như phép đảo duy nhất.
  - hien_tuong: Lô-ga-rit tăng chậm hơn mọi lũy thừa dương.
    co_che: So sánh tiệm cận khi $x\to+\infty$.
    chung_cu: $\ln x=o(x^\alpha)$ với $\alpha>0$.
    bieu_dien: Mệnh đề mở rộng và bài tập.
    doc_nguoc: Tăng không bị chặn không đồng nghĩa với tăng nhanh.
de_cuong_van_hanh:
  cac_mach_lap_luan:
    - Dựng hàm từ tích phân và xác định miền.
    - Chứng minh quy luật biến phép nhân thành phép cộng.
    - Suy ra dấu, giới hạn, đạo hàm, biến thiên và độ cong.
    - Kết tinh bằng bảng biến thiên và đồ thị.
    - Xác lập số e, hàm ngược, đổi cơ số và tốc độ tăng trưởng.
    - Khép lại bằng chuỗi nén và hệ bài tập.
  mang_phu_thuoc:
    mach_can_truoc:
      - Định nghĩa tích phân đứng trước quy luật tích.
      - Quy luật tích và đạo hàm đứng trước giới hạn, biến thiên và đồ thị.
      - Tính song ánh đứng trước hàm ngược.
    menh_de_can_truoc:
      - Định nghĩa ln x.
      - Quy luật ln(ab)=ln a+ln b.
      - Công thức đạo hàm và hai giới hạn biên.
    bieu_dien_phu_thuoc:
      - Bảng biến thiên chỉ xuất hiện sau khi dấu đạo hàm và giới hạn đã được chứng minh.
      - Đồ thị chỉ kết tinh các ràng buộc đã xác lập.
    vong_tron_va_cach_pha:
      - Không dùng đồ thị để chứng minh giới hạn hoặc độ lõm; các kết quả giải tích được xác lập trước.
  trat_tu_nhan_thuc:
    thu_tu:
      - hiện tượng tỉ lệ
      - định nghĩa tích phân
      - bất biến co giãn
      - quy luật tích
      - hệ quả giải tích
      - biểu diễn
      - hàm ngược và mở rộng
      - kết tinh
    li_do: Đi từ cơ chế sinh ra hàm đến các hệ quả, rồi mới dùng biểu diễn để nén thông tin.
    diem_hinh_thanh_du_doan: Sau quy luật tích, người đọc có thể dự đoán cách ln phản ứng với cấp số nhân.
    diem_sua_truc_giac: Phân biệt tăng không bị chặn với tăng nhanh; phân biệt đồ thị minh họa với chứng cứ.
    diem_ket_tinh: Bảng biến thiên, đồ thị toàn cảnh và chuỗi nén cuối bài.
  muc_hien_thi:
    - Định nghĩa, mệnh đề chính, hình, bảng, kết luận và bài tập đều hiện trong mạch chính.
    - Khối mở rộng về cơ số e được thu gọn vì không phải mắt xích bắt buộc.
  kien_truc:
    khoi_mo: Nêu hiện tượng tỉ lệ nhân thành độ dời cộng.
    nhan_dien: Dựng hàm bằng tích phân và xác định tập xác định.
    trien_khai: Quy luật tích, giới hạn, đạo hàm, biến thiên và độ cong.
    ket_tinh: Bảng biến thiên và đồ thị toàn cảnh.
    soi_chieu: Hàm mũ tự nhiên, đổi cơ số và tốc độ tăng trưởng.
    khep_lai: Chuỗi nén và hệ bài tập.
  dieu_kien_dung_rieng:
    - Không còn kết luận thiết yếu thiếu chứng cứ.
    - Hình và bảng chỉ nén kết quả đã xác lập.
    - Các phần mở rộng không làm đứt mạch chính.
