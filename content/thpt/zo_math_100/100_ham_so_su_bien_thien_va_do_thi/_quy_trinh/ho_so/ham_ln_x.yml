phien_ban_ho_so: 4
nhan_dien:
  slug: ham_ln_x
  ten_bai: Hàm số y = ln x
  so_the: 114
  nhan_the:
    - C
  cong_thuc_hien_thi: $y=\ln x$
  ngay_khoi_tao: "2026-07-31"
  ngay_cap_nhat: "2026-08-01"
  trang_thai: da_nghiem_thu_cho_xuat_ban
nhiem_vu:
  che_do: tao_moi
  yeu_cau_goc:
    Chạy quy trình sản xuất bài hàm số cho $y=\ln x$ trên miền tự nhiên, dành cho người đọc của dự án 100+ Hàm
    số, ở mức chuyên sâu và theo phong cách Học thuật tĩnh tại. Tạo hồ sơ, QMD và tài nguyên cần thiết; kiểm định đầy đủ trước
    khi bàn giao. Không sửa quy chuẩn, không staging và không commit.
  muc_tieu:
    Hoàn thiện một bài khảo sát chuyên sâu về hàm số lô-ga-rit tự nhiên, làm rõ cơ chế biến thay đổi theo tỉ lệ thành
    độ dời cộng và các hệ quả đối với miền, giới hạn, biến thiên, độ cong, hàm ngược và đồ thị.
  hien_tuong_nguoi_dung_chi_dinh: null
  nguoi_doc: Người đọc của dự án 100+ Hàm số
  kien_thuc_gia_dinh:
    - khái niệm hàm số và đồ thị
    - đạo hàm cơ bản
    - tích phân xác định cơ bản
    - khái niệm hàm ngược
  muc_do: chuyen_sau
  phong_cach_duoc_chi_dinh: Học thuật tĩnh tại
  rang_buoc_dac_biet:
    - giữ bài trong thư mục core
    - dùng slug ham_ln_x
    - không sửa tài liệu quy chuẩn
    - không staging
    - không commit
